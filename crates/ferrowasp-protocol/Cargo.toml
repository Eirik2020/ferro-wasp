[package]
name = "ferrowasp-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
defmt = { version = "1.0.1", optional = true }
ferrowasp-config = { path = "../ferrowasp-config" }
ferrowasp-flight-control = { path = "../ferrowasp-flight-control" }

[features]
default = []
blackbox_defmt = ["dep:defmt"]

[package]
name = "ferrowasp-flight-control"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# The flight controller's RTIC task definitions, target-only (ADR-0060).
tasks = [
    "dep:ferrowasp-border",
    "dep:ferrowasp-boundary-contracts",
    "dep:ferrowasp-io-contracts",
    "dep:ferrowasp-mpu6500",
    "dep:ferrowasp-safety",
    "dep:ferrowasp-stm32-critical",
    "dep:defmt",
    "dep:ferroforge",
    "dep:fugit",
    "dep:rtic",
    "dep:rtic-monotonics",
]
# Bench and fault-injection images, forwarded from the firmware feature of
# the same name. Never in a flight image.
bench_blackbox = []
bench_equal_motors = []
bench_motor_cmd_stale_rejection = []
bench_motor1_only = []
bench_motor2_only = []
bench_motor3_only = []
bench_motor4_only = []
bench_logical_motor1_only = []
bench_logical_motor2_only = []
bench_logical_motor3_only = []
bench_logical_motor4_only = []

[dependencies]
ferrowasp-border = { path = "../ferrowasp-border", optional = true }
ferrowasp-boundary-contracts = { path = "../ferrowasp-boundary-contracts", optional = true }
ferrowasp-control = { path = "../ferrowasp-control" }
ferrowasp-input = { path = "../ferrowasp-input" }
ferrowasp-io-contracts = { path = "../ferrowasp-io-contracts", optional = true }
ferrowasp-mpu6500 = { path = "../ferrowasp-mpu6500", optional = true }
ferrowasp-safety = { path = "../ferrowasp-safety", optional = true }
ferrowasp-stm32-critical = { path = "../ferrowasp-stm32-critical", optional = true }
libm = "=0.2.16"

[target.'cfg(target_arch = "arm")'.dependencies]
defmt = { version = "=1.0.1", optional = true }
ferroforge = { version = "=0.4.0", optional = true }
fugit = { version = "=0.3.9", optional = true }
rtic = { version = "=2.2.0", default-features = false, features = ["thumbv7-backend"], optional = true }
rtic-monotonics = { version = "=2.1.0", default-features = false, optional = true }

[package.metadata.ferrowasp]
critical = true

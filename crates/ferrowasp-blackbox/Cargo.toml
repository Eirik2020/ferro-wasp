[package]
name = "ferrowasp-blackbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ferrowasp-boundary-contracts = { path = "../ferrowasp-boundary-contracts" }
ferrowasp-config = { path = "../ferrowasp-config" }
ferrowasp-io-contracts = { path = "../ferrowasp-io-contracts" }
ferrowasp-protocol = { path = "../ferrowasp-protocol" }
ferrowasp-storage = { path = "../ferrowasp-storage" }
heapless = { workspace = true }

[dev-dependencies]
ferrowasp-storage = { path = "../ferrowasp-storage", features = ["test-support"] }

[package]
name = "ferrowasp-tasks"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
defmt = { version = "1.0.1", optional = true }
ferrowasp-core = { path = "../ferrowasp-core" }
ferrowasp-drivers = { path = "../ferrowasp-drivers" }
ferrowasp-mspv1 = { path = "../ferrowasp-mspv1" }
ferrowasp-pid = { path = "../ferrowasp-pid" }
heapless = "0.9.2"

[features]
default = []
blackbox_defmt = ["dep:defmt"]

[package]
name = "ferrowasp-drivers"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ferrowasp-blheli-telemetry = { path = "../ferrowasp-blheli-telemetry" }
ferrowasp-crsf = { path = "../ferrowasp-crsf" }
ferrowasp-icm42688p = { path = "../ferrowasp-icm42688p" }
ferrowasp-mpu6000 = { path = "../ferrowasp-mpu6000" }
ferrowasp-mpu6500 = { path = "../ferrowasp-mpu6500" }
ferrowasp-storage = { path = "../ferrowasp-storage" }

[features]
default = []
defmt = ["ferrowasp-mpu6500/defmt"]

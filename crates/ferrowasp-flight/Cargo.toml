[package]
name = "ferrowasp-flight"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
defmt = { version = "1.0.1", optional = true }
ferrowasp-blackbox = { path = "../ferrowasp-blackbox" }
ferrowasp-cli = { path = "../ferrowasp-cli" }
ferrowasp-config = { path = "../ferrowasp-config" }
ferrowasp-control = { path = "../ferrowasp-control" }
ferrowasp-core = { path = "../ferrowasp-core" }
ferrowasp-drivers = { path = "../ferrowasp-drivers" }
ferrowasp-feedback = { path = "../ferrowasp-feedback" }
ferrowasp-flight-control = { path = "../ferrowasp-flight-control" }
ferrowasp-input = { path = "../ferrowasp-input" }
ferrowasp-io-core = { path = "../ferrowasp-io-core" }
ferrowasp-mspv1 = { path = "../ferrowasp-mspv1" }
ferrowasp-osd = { path = "../ferrowasp-osd" }
ferrowasp-protocol = { path = "../ferrowasp-protocol" }
ferrowasp-safety = { path = "../ferrowasp-safety" }
ferrowasp-storage = { path = "../ferrowasp-storage" }
ferrowasp-mspv2 = { path = "../ferrowasp-mspv2", optional = true }
heapless = "0.9.2"
libm = "0.2.11"

[features]
default = []
blackbox_defmt = ["dep:defmt", "ferrowasp-protocol/blackbox_defmt"]
mspv2_configurator = ["dep:ferrowasp-mspv2", "ferrowasp-cli/mspv2_configurator"]

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[package]
name = "ferrowasp-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ferrowasp-config = { path = "../ferrowasp-config" }
ferrowasp-control = { path = "../ferrowasp-control" }
ferrowasp-flight-control = { path = "../ferrowasp-flight-control" }
ferrowasp-protocol = { path = "../ferrowasp-protocol" }
critical-section = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]
# Host tests that write signals take a critical section; std provides one.
critical-section = { workspace = true, features = ["std"] }

[features]
default = []
std = ["critical-section/std"]
bench_motor1_only = []
bench_motor2_only = []
bench_motor3_only = []
bench_motor4_only = []
bench_logical_motor1_only = []
bench_logical_motor2_only = []
bench_logical_motor3_only = []
bench_logical_motor4_only = []
bench_dshot_unequal_motors = []

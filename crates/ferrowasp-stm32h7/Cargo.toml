[package]
name = "ferrowasp-stm32h7"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# STM32H7 mechanisms under the HAL-neutral ones in ferrowasp-stm32: the DMA
# transfers, timers, USB, and storage an H7 flight board wires to the shared
# UART, SPI, ADC, and DShot state machines.

[lib]
path = "src/lib.rs"

[features]
default = []
stm32h743 = [
    "dep:stm32h7xx-hal",
    "stm32h7xx-hal/stm32h743v",
    "stm32h7xx-hal/rt",
    "stm32h7xx-hal/usb_hs",
    "stm32h7xx-hal/sdmmc",
    "dep:sdio-host",
]

[dependencies]
defmt = "1.0.1"
embedded-hal = { workspace = true }
ferrowasp-io-core = { path = "../ferrowasp-io-core" }
ferrowasp-stm32 = { path = "../ferrowasp-stm32", features = ["dshot"] }
ferrowasp-waveform = { path = "../ferrowasp-waveform" }
heapless = { workspace = true }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
# The HAL's own traits are embedded-hal 0.2; the drivers take 1.0.
embedded-hal-02 = { package = "embedded-hal", version = "0.2.7" }
nb = "1.1"
sdio-host = { version = "0.9.0", optional = true }
stm32h7xx-hal = { version = "0.16.0", optional = true }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[package]
name = "ferrowasp-stm32"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# The STM32 mechanisms that do not depend on a chip family's HAL: UART and SPI
# DMA state machines, serial port binding, the DShot bank, ADC sample
# planning, and the shared memory and board-description types. Each family's
# backend (ferrowasp-stm32f4, ferrowasp-stm32h7) puts its HAL under them, so
# every board runs the same policy. Host-testable.

[lib]
path = "src/lib.rs"

[features]
default = []
bench_spi_timeout_recovery = ["ferrowasp-stm32-critical/bench_spi_timeout_recovery"]
dshot = ["ferrowasp-stm32-critical/dshot"]
# The ADC and status-LED RTIC task definitions, target-only (ADR-0065).
tasks = [
    "dep:ferrowasp-boundary-contracts",
    "dep:ferrowasp-io-contracts",
    "dep:ferrowasp-osd",
    "dep:ferrowasp-safety",
    "dep:ferroforge",
    "dep:fugit",
    "dep:rtic",
    "dep:rtic-monotonics",
]

[dependencies]
defmt = "1.0.1"
embedded-hal = { workspace = true }
ferrowasp-boundary-contracts = { path = "../ferrowasp-boundary-contracts", optional = true }
ferrowasp-io-contracts = { path = "../ferrowasp-io-contracts", optional = true }
ferrowasp-osd = { path = "../ferrowasp-osd", optional = true }
ferrowasp-safety = { path = "../ferrowasp-safety", optional = true }
ferrowasp-stm32-critical = { path = "../ferrowasp-stm32-critical" }
heapless = { workspace = true }
rc-pwm = { path = "../rc-pwm" }

[target.'cfg(target_arch = "arm")'.dependencies]
ferroforge = { version = "0.4.0", optional = true }
fugit = { version = "0.3.9", optional = true }
rtic = { version = "2.2.0", default-features = false, features = ["thumbv7-backend"], optional = true }
rtic-monotonics = { version = "2.1.0", default-features = false, optional = true }


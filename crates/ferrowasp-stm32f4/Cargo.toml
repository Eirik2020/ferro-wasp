[package]
name = "ferrowasp-stm32f4"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
bench_spi_timeout_recovery = ["ferrowasp-stm32/bench_spi_timeout_recovery"]
dshot = ["dep:ferrowasp-waveform", "ferrowasp-stm32/dshot"]
# Each chip feature selects the STM32F4 HAL; without one nothing builds.
stm32f401 = ["dep:stm32f4xx-hal", "stm32f4xx-hal/stm32f401"]
stm32f405 = [
    "dep:stm32f4xx-hal",
    "stm32f4xx-hal/stm32f405",
    "stm32f4xx-hal/uart4",
    "stm32f4xx-hal/usb_fs",
]

[dependencies]
defmt = "1.0.1"
ferrowasp-io-core = { path = "../ferrowasp-io-core" }
ferrowasp-stm32 = { path = "../ferrowasp-stm32" }
ferrowasp-waveform = { path = "../ferrowasp-waveform", optional = true }
rc-pwm = { path = "../rc-pwm" }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
# The F401 bring-up heartbeat is an RTIC task definition. The versions are the
# ones the firmware already locks, so selecting it does not move RTIC.
ferroforge = "0.4"
fugit = "0.3.9"
rtic = { version = "2.2.0", default-features = false, features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.1.0", default-features = false }
stm32f4xx-hal = { git = "https://github.com/stm32-rs/stm32f4xx-hal.git", rev = "78d79609137d5c380320f7bf1a9120967babc61d", features = ["rtic2", "defmt"], optional = true }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

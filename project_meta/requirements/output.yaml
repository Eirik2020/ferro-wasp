schema_version: 1
requirements:
  - id: OUTPUT-001
    title: DShot frames carry the commanded value at DShot600 timing
    statement: >-
      Each DShot packet shall carry its value with the standard
      checksum, inverted only in the checksum for bidirectional DShot; a
      four-motor packet set shall keep physical lane order and request
      telemetry on at most the one selected lane; the encoder shall emit
      one duty slot per bit and the reset tail across the full 16-bit
      timer range; the timing shall match DShot600 for the timer clock
      and refuse an invalid clock; and throttle shall map into the
      bounded DShot throttle range.
    rationale: >-
      This is the motor output path (W1); DShot timing is controlled
      configuration (W6), and a wrong checksum, lane or throttle bound
      reaches a motor directly.
    derived_from: [W1, W6]
    allocated_to:
      - ferrowasp_output::dshot
    verification:
      mode: direct
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::packet_crc_matches_known_values
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::bidirectional_packets_invert_only_the_checksum
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::bidirectional_packet_set_keeps_lane_order_and_telemetry_lane
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::four_motor_packet_set_requests_exactly_one_selected_lane
        - level: unit
          target: host
          setup: none

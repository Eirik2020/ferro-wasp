  - id: OUTPUT-003
    title: A bidirectional DShot reply decodes only when it is valid
    statement: >-
      A sampled bidirectional reply shall decode to its value at the
      nominal rate and with the ESC clock a tenth fast or slow; an idle
      line, a line held low, a short buffer, a reply starting too late,
      extra edges, a wrong checksum or a code that is not a GCR symbol
      shall be no reply; eRPM shall decode from its period, and with
      extended telemetry on, typed readings by their type, odd and zero
      types staying eRPM; the EDT acknowledgement shall be recognised
      only before EDT is on; and no line content shall panic the
      decoder.
    rationale: >-
      Reply eRPM becomes the arming qualification and the RPM filter
      input (ADR-0045, ADR-0048); a corrupt reply read as a spinning
      motor would qualify a motor that is not running.
    derived_from: [W2]
    allocated_to:
      - ferrowasp_output::dshot_reply
    verification:
      mode: direct
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::every_value_survives_the_wire_at_the_nominal_rate
        - level: unit
          target: host
          setup: none
          method:

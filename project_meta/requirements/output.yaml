schema_version: 2
requirements:
  - id: OUTPUT-001
    title: A DShot packet carries its value and checksum
    statement: >-
      Each DShot packet shall carry its value with the standard checksum,
      inverted only in the checksum for bidirectional DShot.
    rationale: >-
      This is the motor output path (W1); DShot timing is controlled
      configuration (W6), and a wrong checksum, lane or throttle bound
      reaches a motor directly.
    derived_from: [W1, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::packet_crc_matches_known_values
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::bidirectional_packets_invert_only_the_checksum

  - id: OUTPUT-004
    title: A packet set keeps lane order and one telemetry lane
    statement: >-
      A four-motor DShot packet set shall keep physical lane order and
      request telemetry on at most the one selected lane.
    rationale: >-
      This is the motor output path (W1); DShot timing is controlled
      configuration (W6), and a wrong checksum, lane or throttle bound
      reaches a motor directly.
    derived_from: [W1, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::bidirectional_packet_set_keeps_lane_order_and_telemetry_lane
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::four_motor_packet_set_requests_exactly_one_selected_lane
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::out_of_range_telemetry_lane_requests_none
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::unequal_bench_commands_have_distinct_expected_wire_values
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::mixed_control_vector_preserves_physical_lane_order

  - id: OUTPUT-005
    title: The encoder emits one duty slot per bit
    statement: >-
      The DShot encoder shall emit one duty slot per bit and the reset tail,
      across the full 16-bit timer range.
    rationale: >-
      This is the motor output path (W1); DShot timing is controlled
      configuration (W6), and a wrong checksum, lane or throttle bound
      reaches a motor directly.
    derived_from: [W1, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::encoder_emits_duty_slots_and_reset_tail
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::encoder_accepts_the_full_u16_timer_range_without_overflow
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::compare_sequence_stages_first_bit_and_terminating_zero

  - id: OUTPUT-006
    title: DShot timing matches DShot600
    statement: >-
      DShot timing shall match DShot600 for the timer clock, refusing an
      invalid clock.
    rationale: >-
      This is the motor output path (W1); DShot timing is controlled
      configuration (W6), and a wrong checksum, lane or throttle bound
      reaches a motor directly.
    derived_from: [W1, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::dshot600_timing_matches_tim1_at_168_mhz
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::timing_rejects_invalid_clock_inputs

  - id: OUTPUT-007
    title: Throttle maps into the DShot throttle range
    statement: >-
      Throttle shall map into the bounded DShot throttle range.
    rationale: >-
      This is the motor output path (W1); DShot timing is controlled
      configuration (W6), and a wrong checksum, lane or throttle bound
      reaches a motor directly.
    derived_from: [W1, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::throttle_mapping_is_bounded

  - id: OUTPUT-002
    title: A command lease expires on time
    statement: >-
      A motor command lease shall expire at its inclusive deadline, also
      across a 32-bit millisecond rollover, a reading taken before the lease
      started counting as expired.
    rationale: >-
      A lease that does not lapse leaves a motor commanded after its source
      stopped (W1, W2); a special command mistaken for throttle spins a
      motor.
    derived_from: [W1, W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::command_lease_expires_after_the_inclusive_deadline
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::command_lease_expiry_holds_past_the_old_u32_rollover
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::a_reading_before_the_lease_started_counts_as_expired
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::periodically_renewed_command_lease_covers_a_long_guarded_hold

  - id: OUTPUT-008
    title: A direction change sends each command ten times
    statement: >-
      A spin-direction change shall send each special command ten times and
      then stop.
    rationale: >-
      A lease that does not lapse leaves a motor commanded after its source
      stopped (W1, W2); a special command mistaken for throttle spins a
      motor.
    derived_from: [W1, W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::direction_sequence_sends_each_command_ten_times_then_stops

  - id: OUTPUT-009
    title: A special command is never throttle
    statement: >-
      No DShot special command shall be a throttle value.
    rationale: >-
      A lease that does not lapse leaves a motor commanded after its source
      stopped (W1, W2); a special command mistaken for throttle spins a
      motor.
    derived_from: [W1, W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::direction_commands_are_not_throttle_values

  - id: OUTPUT-003
    title: A valid reply decodes across ESC clock error
    statement: >-
      A sampled bidirectional DShot reply shall decode to its value at the
      nominal rate and with the ESC clock a tenth fast or slow.
    rationale: >-
      Reply eRPM becomes the arming qualification and the RPM filter input;
      a corrupt reply read as a spinning motor would qualify a motor that is
      not running.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::every_value_survives_the_wire_at_the_nominal_rate
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::every_value_survives_a_tenth_fast_or_slow_esc_clock
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::a_sampled_reply_decodes_end_to_end

  - id: OUTPUT-010
    title: An invalid reply is no reply
    statement: >-
      An idle line, a line held low, a short buffer, a reply starting too
      late, extra edges, a wrong checksum or a code that is not a GCR symbol
      shall be no reply.
    rationale: >-
      Reply eRPM becomes the arming qualification and the RPM filter input;
      a corrupt reply read as a spinning motor would qualify a motor that is
      not running.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::an_idle_line_or_a_short_buffer_is_no_reply
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::a_line_held_low_is_no_reply
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::a_reply_starting_too_late_in_the_buffer_is_no_reply
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::extra_edges_after_a_reply_are_overlong
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::a_wrong_checksum_is_rejected
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::a_code_that_is_not_a_symbol_is_rejected

  - id: OUTPUT-011
    title: Reply values decode by their type
    statement: >-
      A reply shall decode as eRPM from its period, and with extended
      telemetry on as a typed reading by its type, odd and zero types
      staying eRPM.
    rationale: >-
      Reply eRPM becomes the arming qualification and the RPM filter input;
      a corrupt reply read as a spinning motor would qualify a motor that is
      not running.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::erpm_values_decode_from_their_period
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::without_extended_telemetry_every_value_is_erpm
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::extended_telemetry_values_decode_by_type
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::with_extended_telemetry_odd_and_zero_types_stay_erpm

  - id: OUTPUT-012
    title: The EDT acknowledgement is recognised only before EDT
    statement: >-
      The EDT acknowledgement shall be recognised only before extended
      telemetry is on.
    rationale: >-
      Reply eRPM becomes the arming qualification and the RPM filter input;
      a corrupt reply read as a spinning motor would qualify a motor that is
      not running.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::the_edt_acknowledgement_is_recognised_only_before_edt_is_on

  - id: OUTPUT-013
    title: No line content panics the reply decoder
    statement: >-
      No line content shall panic the reply decoder.
    rationale: >-
      Reply eRPM becomes the arming qualification and the RPM filter input;
      a corrupt reply read as a spinning motor would qualify a motor that is
      not running.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot_reply::tests::random_lines_never_panic_and_rarely_pass_the_checksum

  - id: OUTPUT-002
    title: A command lease expires on time, and special commands are never throttle
    statement: >-
      A motor command lease shall expire at its inclusive deadline, also
      past the former 32-bit millisecond rollover, and a reading taken
      before the lease started shall count as expired; a direction
      change shall send each special command ten times and then stop,
      and no special command shall be a throttle value.
    rationale: >-
      A lease that does not lapse leaves a motor commanded after its
      source stopped (W1, W2); a special command mistaken for throttle
      spins a motor.
    derived_from: [W1, W2]
    allocated_to:
      - ferrowasp_output::dshot::command_lease_expired
      - ferrowasp_output::dshot::DshotCommandSequence
    verification:
      mode: direct
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::command_lease_expires_after_the_inclusive_deadline
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::command_lease_expiry_holds_past_the_old_u32_rollover
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_output::dshot::tests::a_reading_before_the_lease_started_counts_as_expired
        - level: unit
          target: host
          setup: none
          method:

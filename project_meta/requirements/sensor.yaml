schema_version: 2
requirements:
  - id: SENSOR-001
    title: A measurement at or past its age limit is stale
    statement: >-
      A sensor measurement shall be judged stale once its age at the
      consumer's time reaches the consumer's limit, and unusable when it is
      stamped later than that time.
    rationale: >-
      Stale sensor data is a high-priority defect. A stamp later than the
      consumer's time can only come from a clock or stamping fault, so it
      must not pass as fresh either.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::class::tests::a_measurement_is_stale_at_its_age_limit_and_future_when_stamped_ahead
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::class::tests::a_measurement_stamped_near_the_end_of_time_never_wraps_fresh

  - id: SENSOR-002
    title: A sensor numbers its measurements
    statement: >-
      A sensor shall number the measurements it returns from 1, one more for
      each, skipping 0 when the count wraps.
    rationale: >-
      A consumer then reads a repeated number as nothing new and a gap as
      measurements lost, as it does on a link, and 0 stays free to mean
      that nothing was measured yet.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::class::tests::measurement_sequences_start_at_one_and_skip_zero_when_they_wrap
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_good_sample_is_compensated_stamped_and_numbered

  - id: SENSOR-003
    title: A barometer sample outside its part's limits is refused
    statement: >-
      A barometer sample shall be refused as out of range when its pressure
      or its temperature lies outside the limits its part declares.
    rationale: >-
      A value outside the part's operating range is not a measurement to
      believe; refusing it, rather than clamping it, keeps a faulty reading
      from passing as a plausible one.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::barometer::tests::a_barometer_sample_outside_its_limits_is_refused

  - id: SENSOR-004
    title: A floating-point barometer value never saturates
    statement: >-
      Converting a floating-point pressure or temperature into a barometer
      sample shall refuse a value that is not finite or does not fit the
      integer unit, never saturating or wrapping it.
    rationale: >-
      Drivers compute in floating point and release builds do not check
      overflow; a saturated or wrapped integer would turn a failed
      computation into a value that looks like a measurement.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::barometer::tests::floating_point_pressure_rounds_and_never_saturates
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::barometer::tests::floating_point_temperature_rounds_both_ways_and_never_saturates

  - id: SENSOR-005
    title: An IMU decoder refuses short and stuck-bus bursts
    statement: >-
      An IMU decoder shall refuse a burst shorter than its declared length as
      a bus error, and a burst whose payload is all zero or all one bits as
      out of range.
    rationale: >-
      A short transfer, or a stuck or absent bus, would otherwise decode into
      rates and accelerations the control loop would trust.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::imu::tests::an_imu_refuses_short_and_stuck_bus_bursts

  - id: SENSOR-006
    title: Only a valid fix carries a position
    statement: >-
      A GNSS solution shall expose a position and velocity only for a
      two-dimensional, three-dimensional or combined GNSS and dead-reckoning
      fix that its source marks valid.
    rationale: >-
      No fix, a dead-reckoning-only or time-only fix, or a fix its source
      does not mark valid must never be read as a position.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::gnss::tests::only_a_valid_position_fix_exposes_a_position

  - id: SENSOR-007
    title: A GNSS value outside its physical range is refused
    statement: >-
      A GNSS latitude, longitude, ground speed, heading of motion or UTC time
      outside its physical range shall be refused as out of range.
    rationale: >-
      Such a value can only come from a corrupt or misdecoded message, and
      must not reach navigation as a plausible one.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::gnss::tests::a_gnss_value_outside_its_physical_range_is_refused

  - id: SENSOR-008
    title: Only a valid UTC time is carried
    statement: >-
      A GNSS solution shall carry a UTC time only when its source marks the
      date and the time valid and fully resolved.
    rationale: >-
      A receiver reports date and time fields before it has resolved them;
      an unresolved time must not be logged or used as the real one.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::gnss::tests::a_utc_time_exists_only_when_marked_valid_and_resolved

  - id: SENSOR-009
    title: A part with the wrong identity is refused
    statement: >-
      A sensor implementation shall refuse a part whose identity differs from
      the one it expects, reporting the identity it found.
    rationale: >-
      A different part, or no part, answers with registers of another
      meaning; reporting what was found tells a wrongly populated board from
      a dead bus.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::class::tests::an_identity_other_than_the_expected_one_is_a_mismatch

  - id: SENSOR-010
    title: The DPS310 adapter never repeats a sample
    statement: >-
      The DPS310 adapter shall return a barometer sample only for a pressure
      and temperature result the part flagged new since the previous read,
      and report no new sample otherwise.
    rationale: >-
      No barometer driver signals freshness robustly, so the adapter owns
      it: an old value offered again would pass as a fresh measurement.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::without_a_new_result_a_read_is_never_the_previous_sample
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_good_sample_is_compensated_stamped_and_numbered
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_raw_zero_reads_back_the_offset_coefficients_exactly
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_read_before_bring_up_is_refused_and_the_bus_is_given_back

  - id: SENSOR-011
    title: The DPS310 adapter bounds bring-up, reads and measurement gaps
    statement: >-
      The DPS310 adapter shall report a timeout when bring-up outlasts its
      clock budget or the driver's wait budget, when a read outlasts its
      budget, or when no new result arrives within its stall limit.
    rationale: >-
      Unbounded work is a defect, and a sensor that stops measuring must be
      told apart from the normal gap between measurements.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::bring_up_that_never_completes_times_out
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::the_drivers_wait_budget_ends_bring_up_before_the_clock_does
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_read_that_overruns_its_budget_is_a_timeout_and_its_result_discarded
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_sensor_that_never_measures_after_bring_up_times_out
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::without_a_new_result_a_read_is_never_the_previous_sample
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::time_near_the_end_of_the_clock_fails_closed
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::the_stall_limit_follows_the_slower_rate_and_saturates

  - id: SENSOR-012
    title: The DPS310 adapter checks the whole product ID
    statement: >-
      The DPS310 adapter shall refuse a part whose product ID register reads
      other than 0x10.
    rationale: >-
      The driver compares only the revision nibble, so another product of the
      same revision would pass it.
    derived_from: [SENSOR-009]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_product_id_other_than_the_dps310s_is_refused

  - id: SENSOR-013
    title: The DPS310 adapter refuses values outside the operating range
    statement: >-
      The DPS310 adapter shall refuse a pressure outside 300 to 1200 hPa or a
      temperature outside -40 to 85 degrees Celsius as out of range.
    rationale: >-
      These are the part's operating range; outside it the part does not
      claim a valid measurement.
    derived_from: [SENSOR-003]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_value_outside_the_operating_range_is_refused

  - id: SENSOR-014
    title: A DPS310 bus failure is a bus error
    statement: >-
      The DPS310 adapter shall report a failed transfer at any step as a bus
      error and return no sample from that call.
    rationale: >-
      A bus fault must be told apart from a missing or implausible result,
      and must never let a partly read or earlier result through.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::dps310::tests::a_bus_error_at_any_step_is_a_bus_error_and_never_a_sample

  - id: SENSOR-015
    title: A compass sample outside its part's limits is refused
    statement: >-
      A compass implementation shall refuse a field sample any of whose
      components lies outside the limits its part declares, or that was
      built from a value it cannot hold.
    rationale: >-
      A field outside the part's measuring range is not a measurement to
      believe; refusing it, rather than clamping it, keeps a faulty reading
      from passing as a heading reference, and a value that cannot be held
      cannot be checked at all.
    derived_from: [SENSOR-003]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensor_traits::compass::tests::a_compass_sample_outside_its_limits_is_refused

  - id: SENSOR-016
    title: The SPL06 adapter never repeats a sample
    statement: >-
      The SPL06 adapter shall return a barometer sample only from a
      pressure and temperature measurement it started and saw the part
      flag ready, and report no new sample otherwise.
    rationale: >-
      The adapter drives the part in its command mode, so every sample
      follows a measurement the adapter asked for; a value the part repeats
      without a new command can never pass as a fresh measurement.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::without_a_new_result_a_read_is_never_the_previous_sample
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::a_good_sample_is_compensated_stamped_and_numbered
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::a_read_before_bring_up_is_refused

  - id: SENSOR-017
    title: The SPL06 adapter bounds bring-up, reads and measurement gaps
    statement: >-
      The SPL06 adapter shall report a timeout when bring-up outlasts its
      clock budget, when a read outlasts its budget, or when no new result
      arrives within its stall limit.
    rationale: >-
      Unbounded work is a defect, and a sensor that stops measuring must be
      told apart from the normal gap between measurements.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::bring_up_that_never_completes_times_out
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::time_near_the_end_of_the_clock_fails_closed
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::a_read_that_overruns_its_budget_is_a_timeout_and_its_result_discarded
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::without_a_new_result_a_read_is_never_the_previous_sample

  - id: SENSOR-018
    title: The SPL06 adapter checks the chip ID
    statement: >-
      The SPL06 adapter shall refuse a part whose chip ID register reads
      other than 0x10.
    rationale: >-
      The chip ID is the part's one identity byte; a different part, or no
      part, answers with registers of another meaning, and reporting what
      was found tells a wrongly populated board from a dead bus.
    derived_from: [SENSOR-009]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::a_chip_id_other_than_the_spl06s_is_refused

  - id: SENSOR-019
    title: The SPL06 adapter refuses values outside the operating range
    statement: >-
      The SPL06 adapter shall refuse a pressure outside 300 to 1200 hPa or
      a temperature outside -40 to 85 degrees Celsius as out of range.
    rationale: >-
      These are the part's operating range; outside it the part does not
      claim a valid measurement.
    derived_from: [SENSOR-003]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::a_value_outside_the_operating_range_is_refused

  - id: SENSOR-020
    title: An SPL06 bus failure is a bus error
    statement: >-
      The SPL06 adapter shall report a failed transfer at any step as a bus
      error and return no sample from that call.
    rationale: >-
      A bus fault must be told apart from a missing or implausible result,
      and must never let a partly read or earlier result through.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::spl06::tests::a_bus_error_at_any_step_is_a_bus_error_and_never_a_sample

  - id: SENSOR-021
    title: The QMC5883L adapter never repeats a sample
    statement: >-
      The QMC5883L adapter shall return a compass sample only for a field
      the part flagged new, and report no new sample otherwise.
    rationale: >-
      A value the part did not flag new would pass as a fresh measurement;
      the adapter reads the part's ready flag and takes the field only
      behind it.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::without_a_new_field_a_read_is_never_the_previous_sample
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::a_good_field_is_scaled_stamped_and_numbered
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::bring_up_resets_identifies_and_configures_the_part

  - id: SENSOR-022
    title: The QMC5883L adapter bounds bring-up, reads and field gaps
    statement: >-
      The QMC5883L adapter shall report a timeout when bring-up outlasts
      its clock budget, when a read outlasts its budget, or when no new
      field arrives within its stall limit.
    rationale: >-
      Unbounded work is a defect, and a sensor that stops measuring must be
      told apart from the normal gap between fields.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::bring_up_that_never_completes_times_out
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::a_read_that_overruns_its_budget_is_a_timeout_and_its_result_discarded
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::without_a_new_field_a_read_is_never_the_previous_sample

  - id: SENSOR-023
    title: The QMC5883L adapter checks the part's identity twice
    statement: >-
      The QMC5883L adapter shall refuse a part whose ID register reads
      other than 0xFF, or whose control register does not answer standby
      after a reset, reporting the value it found.
    rationale: >-
      A stuck bus answers 0xFF as readily as a QMC5883L does, so the
      reset part's standby state is the second witness; iNav's detection
      checks the same pair.
    derived_from: [SENSOR-009]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::a_wrong_id_or_unreset_part_is_refused

  - id: SENSOR-024
    title: The QMC5883L adapter refuses fields it cannot believe
    statement: >-
      The QMC5883L adapter shall refuse as out of range a field the part
      flagged overflowed, and a field outside the configured measuring
      range.
    rationale: >-
      A field that overflowed the part's range, or one outside the range
      it was configured for, is not a measurement to scale into a heading
      reference.
    derived_from: [SENSOR-015]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::an_overflowed_or_out_of_range_field_is_refused

  - id: SENSOR-025
    title: A QMC5883L bus failure is a bus error
    statement: >-
      The QMC5883L adapter shall report a failed transfer at any step as a
      bus error and return no sample from that call.
    rationale: >-
      A bus fault must be told apart from a missing or implausible result,
      and must never let a partly read or earlier result through.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::qmc5883l::tests::a_bus_error_at_any_step_is_a_bus_error_and_never_a_sample

  - id: SENSOR-026
    title: The UBX adapter carries only what the receiver vouches for
    statement: >-
      The UBX adapter shall turn a NAV-PVT into a solution only through the
      GNSS class's own fix and value checks, so a solution the receiver did
      not mark valid carries no position, and a value outside its physical
      range is refused.
    rationale: >-
      The receiver's own flags are the first witness of a solution's
      validity and the class's constructors are the second; neither is
      bypassed, so an unusable fix has no position to misread.
    derived_from: [SENSOR-006, SENSOR-007]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::ubx::tests::a_good_solution_is_converted_stamped_and_numbered
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::ubx::tests::a_solution_without_a_valid_fix_carries_no_position
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::ubx::tests::a_solution_outside_the_physical_range_is_refused
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::ubx::tests::frames_of_other_messages_are_skipped_until_a_solution

  - id: SENSOR-027
    title: The UBX adapter bounds reads and solution gaps
    statement: >-
      The UBX adapter shall report a timeout when a read outlasts its
      budget or when no new solution arrives within its stall limit.
    rationale: >-
      A burst larger than one read's budget is abandoned rather than
      chased, and a receiver that stops sending must be told apart from
      the normal gap between solutions.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::ubx::tests::a_read_that_overruns_its_budget_is_a_timeout_and_its_result_discarded
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::ubx::tests::without_a_new_solution_a_read_is_never_the_previous_sample

  - id: SENSOR-028
    title: A UBX port failure is a bus error
    statement: >-
      The UBX adapter shall report a failed port at any step as a bus
      error and return no solution from that call.
    rationale: >-
      A port fault must be told apart from a missing or implausible
      solution, and must never let a partly read or earlier one through.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrowasp_sensors::ubx::tests::a_port_error_is_a_bus_error_and_never_a_sample





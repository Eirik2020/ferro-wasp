schema_version: 2
requirements:
  - id: ARM-001
    title: Arming waits for qualified idle on every motor
    statement: >-
      An arm request shall reach the armed transition only after the arming
      guard (permission, valid link, arm switch, low throttle), the guarded
      DShot stop dwell, and idle qualification on fresh, consecutive,
      in-range eRPM from every output.
    rationale: >-
      A motor that does not spin up as expected must be found on the ground,
      before authority is handed to the control loop.
    derived_from: [W1, W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_safety::arming::tests::the_guard_is_checked_through_the_whole_hold_and_once_at_its_end
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_safety::arming::tests::a_guard_that_fails_during_the_hold_ends_it_at_once
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_safety::arming::tests::a_zero_poll_interval_still_makes_progress
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_safety::tests::arming_guard_requires_permission_link_arm_switch_and_low_throttle
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_feedback::esc_manager::tests::idle_qualification_requires_fresh_consecutive_samples_from_every_output
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: ARM-004
    title: Bad eRPM aborts arming
    statement: >-
      Zero, stale or overspeed eRPM during idle qualification shall abort
      the arming attempt.
    rationale: >-
      A motor that does not spin up as expected must be found on the ground,
      before authority is handed to the control loop.
    derived_from: [W1, W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_feedback::esc_manager::tests::zero_erpm_never_qualifies_and_times_out
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_feedback::esc_manager::tests::idle_overspeed_fails_immediately_after_spinup_grace
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_feedback::esc_manager::tests::stale_output_sample_prevents_idle_qualification
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: ARM-002
    title: Disarming stops every motor
    statement: >-
      On disarm, every motor shall receive its stop value and report zero
      eRPM.
    rationale: >-
      Disarm is the pilot's last command; it must end all motor output.
    derived_from: [W1, W2]
    verification:
      entries:
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: ARM-003
    title: A connected computer blocks arming
    statement: >-
      Arming shall be refused while a host lease stands: USB's, renewed
      while a host has the board configured and lasting 500 ms, or the
      configurator link's, renewed by each command and lasting 2 s.
    rationale: >-
      A craft on a desk beside a computer is being configured, and the
      command line must never be a path to spinning props (W1).
    derived_from: [W1]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_safety::tests::prearm_health_requires_ready_calibrated_fresh_imu
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_safety::host::tests::either_link_holds_the_host_present

schema_version: 2
requirements:
  - id: SERIAL-001
    title: Port bindings resolve once, and a conflict drops the binding
    statement: >-
      Bindings shall resolve once at boot: RC input shall take the
      configured protocol, and CRSF and the command line a port that
      also transmits; a binding the port cannot carry shall be dropped
      and reported while the rest apply; a function bound to two ports
      shall be on neither; and stored bindings shall round-trip,
      rejecting an unknown function.
    rationale: >-
      Serial bindings are stored configuration (W6); a function bound
      twice or to a port that cannot carry it must fail visibly, never
      leave RC on a guessed port.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::rc_input_takes_the_configured_protocol_and_crsf_needs_a_transmit_path
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::the_configurator_needs_a_port_that_carries_the_command_line_and_transmits
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::valid_bindings_resolve_to_their_profiles
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::a_port_that_cannot_carry_the_protocol_is_dropped
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::a_function_on_two_ports_is_on_neither
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::bindings_round_trip_and_reject_unknown_functions
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::names_parse_back
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::binding::tests::slots_take_one_endpoint_per_function

  - id: SERIAL-002
    title: Each protocol has its line settings, and a port carries only what it is wired for
    statement: >-
      Each protocol shall use its line settings: SBUS 100 000 baud with
      8 data bits, even parity and two stop bits; CRSF 420 000 baud 8N1;
      MSP, the command line and ESC telemetry 115 200 baud 8N1. A
      protocol that answers shall need a transmit path, and a port shall
      refuse a protocol its wiring cannot carry.
    rationale: >-
      Line settings are a public wire format (W6); wrong settings read
      as garbage, which the parsers must then reject.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::routing::tests::each_protocol_uses_its_line_settings
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::routing::tests::a_port_refuses_what_its_wiring_cannot_carry
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::routing::tests::only_protocols_that_answer_need_a_transmit_path

  - id: SERIAL-003
    title: The serial reader delivers bytes in order and never hides a gap
    statement: >-
      The serial reader shall deliver received bytes in order, split one
      chunk across reads without losing bytes and never join adjacent
      chunks into one read; on an overflow it shall record a
      discontinuity, mark the next chunk and wake a waiting reader even
      with no data; a dropped pending read shall consume nothing; and a
      disabled empty stream shall return a structured error.
    rationale: >-
      A consumer that cannot see lost bytes joins halves of two frames
      into one valid-looking frame (ADR-0011).
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:

  - id: SERIAL-004
    title: The serial writer is bounded and ordered, and a fault clears it
    statement: >-
      The serial writer shall split writes into ordered, bounded chunks,
      wait for owner capacity rather than drop bytes, report a flush
      only after the queue and the hardware complete, enqueue nothing
      for a dropped write, and on an owner fault wake a pending flush
      and clear the queued chunks.
    rationale: >-
      The OSD and telemetry share a transport that may also carry RC; an
      unbounded or stuck writer must not hold that port.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_serial::writer::tests::write_copies_at_most_one_owned_chunk
        - level: unit

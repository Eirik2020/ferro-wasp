schema_version: 2
requirements:
  - id: BOOT-001
    title: Motor outputs stay stopped through boot and reset
    statement: >-
      From cold power, a reset or a brownout, every motor output shall
      hold its stop value until the actuator-output task runs, with no
      pulse before it, and the system shall come up disarmed.
    rationale: >-
      A boot or reset is the moment no task yet guards the motors;
      nothing may move then.
    derived_from: [W1, W2]
    verification:
      entries:
        - level: mcu
          target: fcu
          setup: none
          method:
            procedure: project_meta/testing/targets/common-boot-idle.md#Boot and Idle State

  - id: BOOT-002
    title: No RC at boot keeps the craft disarmed
    statement: >-
      With the RC receiver disconnected at boot, the firmware shall stay
      disarmed, and the scheduler shall show it is alive through the
      boot log and the LED heartbeat.
    rationale: >-
      A missing receiver must fail closed and be visible, never leave
      the craft in a guessed state.
    derived_from: [W2]
    verification:
      entries:
        - level: mcu
          target: fcu
          setup: none
          method:
            procedure: project_meta/testing/targets/common-boot-idle.md#Boot and Idle State

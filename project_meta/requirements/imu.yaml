  - id: IMU-003
    title: The ICM-42688-P driver configures, verifies and decodes the sensor
    statement: >-
      The ICM-42688-P driver shall configure 2 kHz output, a 16 g
      accelerometer, a 2000 dps gyro and big-endian data; shall reset
      the part, verify its identity, its reset completion, its
      configuration and its data-ready interrupt by readback, and wait
      for gyro startup; and shall read samples from the temperature
      register in the part's register order, convert them at the
      selected full scales, reject short and stuck-bus frames, and
      release chip select even when SPI fails.
    rationale: >-
      A sensor misidentified, misconfigured or misread feeds the rate
      loop wrong rates; a chip select left asserted after a failure
      blocks the bus.

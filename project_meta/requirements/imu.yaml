  - id: IMU-004
    title: An SPI transaction completes once, for the job that started it
    statement: >-
      The IMU bus shall hold one job per slot and refuse a second while
      it is occupied; a job shall pack its operations without keeping
      their borrows, check its capacity and operation limit before
      replacing the previous job, and copy results back only to its read
      operations, refusing a mismatched shape before any write; a
      timeout shall request the owner's cancellation and reject a late
      interrupt; a dropped waiter shall cancel its job; and a completion
      from an older generation shall never complete a newer job, nor a
      DMA error copy data back.
    rationale: >-
      The IMU samples the rate loop flies on arrive over this mailbox; a
      completion credited to the wrong job, or late data copied into a
      new one, would feed the loop a sample from another time
      (ADR-0010).
    derived_from: [W2]
    verification:

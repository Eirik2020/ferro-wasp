schema_version: 2
requirements:
  - id: LOG-001
    title: Each arming is one flight of pages in order
    statement: >-
      Each arming shall be recorded as one flight of pages, in order.
    rationale: >-
      The blackbox is the evidence for every flight claim; an incomplete log
      proves nothing.
    derived_from: [W7]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_blackbox::log_writer::tests::an_arming_is_one_flight_of_pages_in_order_and_disarming_closes_it
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_blackbox::records::tests::a_torn_page_ends_its_flight_and_logging_carries_on_after_it
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate
        - level: flight
          target: fcu
          setup: none
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Conservative Logged-Hop Flight Test

  - id: LOG-002
    title: The final page commits soon after disarm
    statement: >-
      After disarm, the flight's final page shall commit within two seconds.
    rationale: >-
      The blackbox is the evidence for every flight claim; an incomplete log
      proves nothing.
    derived_from: [W7]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_blackbox::records::tests::a_flight_is_unfinished_until_its_last_page_is_written
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate
        - level: flight
          target: fcu
          setup: none
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Conservative Logged-Hop Flight Test

  - id: LOG-003
    title: A downloaded flight is complete
    statement: >-
      A downloaded flight shall be CRC-valid, with no missing or repeated
      samples.
    rationale: >-
      The blackbox is the evidence for every flight claim; an incomplete log
      proves nothing.
    derived_from: [W7]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_blackbox::records::tests::a_streamed_tick_becomes_the_record_the_control_loop_built
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_blackbox::records::tests::the_divisor_keeps_ticks_whose_sequence_it_divides
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate
        - level: flight
          target: fcu
          setup: none
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Conservative Logged-Hop Flight Test

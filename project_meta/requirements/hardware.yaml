  - id: HW-DSHOT-001
    title: The DShot bank sends every lane together, and a lane fault stops the bank
    statement: >-
      The DShot bank shall configure each timer for its lanes and start
      them together, refuse a lane on a channel already used, on a timer
      it was not given or on timers with different clocks; for
      bidirectional DShot it shall need every lane to receive, invert
      every checksum, complete a frame set only after its receive
      window, decode each reply once, count a missing reply without
      faulting, and fault the bank when a lane cannot turn around or
      back or a window never closes; special-command runs shall be
      refused while a motor runs or a lease holds and cancelled by a
      throttle demand; the fallback shall keep frames going when no
      command arrives; and on target, the outputs shall stay stopped
      through boot and carry the arming sequence props-off.
    rationale: >-
      This is the motor output path (W1); a lane that misbehaves must
      stop the bank, never leave a motor on a guessed command (W2), and
      DShot timing is controlled configuration (W6).

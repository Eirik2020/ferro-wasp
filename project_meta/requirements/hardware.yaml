schema_version: 2
requirements:
  - id: HW-UART-001
    title: A UART hands the core every received byte once, and marks every gap
    statement: >-
      UART reception shall detach a full buffer and an idle-terminated
      partial one as chunks of the bytes received, deliver a full buffer
      before an idle seen with it, clamp an idle length to the buffer,
      and advance the stream generation on a full buffer, a DMA error or
      an abort so that a late interrupt from an older generation is
      suppressed; UART transmission shall give each transfer one
      terminal completion, refuse an overlapping transfer, let a
      transfer error pre-empt completion and treat a FIFO error as
      recoverable; and on target, the RC receiver shall run over it.
    rationale: >-
      This is the serial RX and TX contract (ADR-0011, ADR-0057) every
      chip family implements; a chunk joined across a gap or delivered
      twice reads as a valid frame that never arrived.
    derived_from: [W2]

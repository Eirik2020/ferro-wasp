  - id: HW-DSHOT-001
    title: The DShot bank starts its lanes together
    statement: >-
      The DShot bank shall configure each timer for its lanes and start them
      together, refusing a lane on a channel already used, on a timer it was
      not given or on timers with different clocks.
    rationale: >-
      This is the motor output path (W1); a lane that misbehaves must stop
      the bank, never leave a motor on a guessed command (W2), and DShot
      timing is controlled configuration (W6).
    derived_from: [W1, W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::dshot_lanes::tests::configures_each_timer_for_its_lane_channels_and_wires_the_trigger
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::dshot_lanes::tests::a_frame_stages_every_used_timer_and_starts_all_but_the_triggered_one
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::dshot_lanes::tests::software_start_starts_every_used_timer
        - level: unit
          target: host
          setup: none
          method:

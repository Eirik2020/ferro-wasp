        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::timer_dma::tests::dshot_feature_reports_the_four_motor_bench_state

  - id: HW-DSHOT-002
    title: A bidirectional frame set completes after its window
    statement: >-
      For bidirectional DShot the bank shall need every lane to receive,
      invert every checksum, and complete a frame set only after its receive
      window.
    rationale: >-
      This is the motor output path (W1); a lane that misbehaves must stop
      the bank, never leave a motor on a guessed command (W2), and DShot
      timing is controlled configuration (W6).

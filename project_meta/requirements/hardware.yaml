  - id: HW-TIME-001
    title: The board's clocks and control tick run the loop at its rate
    statement: >-
      Each chip family shall configure its clocks, timebase and control tick
      so that the scheduler runs and the control loop runs at the board's
      configured rate, as the boot and idle check observes.
    rationale: >-
      Every freshness and staleness decision reads this timebase, and the
      loop rate is controlled configuration (W6); these modules have no host
      tests yet, so the boot check is their evidence until the conformance
      suite exists.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: mcu
          target: fcu
          setup: none
          method:
            procedure: project_meta/testing/targets/common-boot-idle.md#Boot and Idle State

  - id: HW-ROUTE-001
    title: Each DMA route matches the board's manifest
    statement: >-
      Each board's DMA routes shall match the claims in its manifest.
    rationale: >-
      Pin maps, DMA streams and timer assignments are controlled
      configuration (W6); a route that does not match its claim drives the
      wrong peripheral.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::board_routes::tests::dma_route_matches_full_manifest_claim


schema_version: 2
requirements:
  - id: HW-UART-001
    title: UART reception detaches every received byte once
    statement: >-
      UART reception shall detach a full buffer and an idle-terminated
      partial one as chunks of the bytes received, delivering a full buffer
      before an idle seen with it and clamping an idle length to the buffer.
    rationale: >-
      This is the serial RX and TX contract every chip family implements; a
      chunk joined across a gap or delivered twice reads as a valid frame
      that never arrived.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::full_buffer_detaches_and_advances_generation
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::idle_detaches_partial_buffer_and_suppresses_late_full_irq
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::empty_idle_does_not_advance_generation
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::partial_idle_len_is_clamped_to_capacity
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::irq_plan::tests::no_flags_produce_no_action
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::irq_plan::tests::dma_full_is_delivered_before_idle_when_both_flags_are_seen
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::irq_plan::tests::idle_partial_delivery_records_received_length

  - id: HW-UART-002
    title: A gap advances the stream generation
    statement: >-
      UART reception shall advance the stream generation on a full buffer, a
      DMA error or an abort, so that a late interrupt from an older
      generation is suppressed.
    rationale: >-
      This is the serial RX and TX contract every chip family implements; a
      chunk joined across a gap or delivered twice reads as a valid frame
      that never arrived.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::full_buffer_detaches_and_advances_generation
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::idle_detaches_partial_buffer_and_suppresses_late_full_irq
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::full_irq_suppresses_late_idle_for_old_generation
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::empty_idle_does_not_advance_generation
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::rx_state::tests::abort_generation_suppresses_late_events_without_flipping_active_buffer
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::irq_plan::tests::dma_error_advances_generation_and_reports_fault

  - id: HW-UART-003
    title: A UART transfer has one terminal completion
    statement: >-
      UART transmission shall give each transfer one terminal completion,
      refusing an overlapping transfer, letting a transfer error pre-empt
      completion and treating a FIFO error as recoverable.
    rationale: >-
      This is the serial RX and TX contract every chip family implements; a
      chunk joined across a gap or delivered twice reads as a valid frame
      that never arrived.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::tx_state::tests::one_transfer_has_one_terminal_completion
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::tx_state::tests::overlapping_transfer_is_rejected
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::tx_state::tests::stale_error_is_ignored_and_does_not_poison_next_transfer
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::tx_state::tests::fifo_error_is_recoverable_and_does_not_finish_transfer
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::tx_state::tests::fifo_flag_does_not_hide_simultaneous_completion
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::serial::tx_state::tests::transfer_error_preempts_completion

  - id: HW-UART-004
    title: The RC receiver runs over the UART on the board
    statement: >-
      On the board, the RC receiver shall run over the UART transport.
    rationale: >-
      This is the serial RX and TX contract every chip family implements; a
      chunk joined across a gap or delivered twice reads as a valid frame
      that never arrived.
    derived_from: [W2]
    verification:
      entries:
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: HW-SPI-001
    title: An SPI DMA completion delivers once
    statement: >-
      An SPI DMA completion shall deliver its data and advance the
      transaction, with no flag meaning no action.
    rationale: >-
      The rate loop flies on IMU samples that cross this transport; a
      completion credited twice or a silent DMA error feeds it a sample that
      is not current.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::spi::tests::no_flags_have_no_action
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::spi::tests::transfer_complete_delivers_and_advances_transaction

  - id: HW-SPI-002
    title: An SPI DMA error is a fault
    statement: >-
      An SPI DMA error shall report a fault without advancing the

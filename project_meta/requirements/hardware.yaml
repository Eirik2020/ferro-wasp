  - id: HW-SPI-001
    title: An SPI transfer completes once, and a DMA error is a fault
    statement: >-
      An SPI DMA completion shall deliver its data and advance the
      transaction, a DMA error shall report a fault without advancing
      it, and no flag shall mean no action; the DMA buffers shall fit
      the static storage budget; and on target, the IMU shall be read
      through it with a healthy calibration at boot.
    rationale: >-
      The rate loop flies on IMU samples that cross this transport
      (ADR-0010); a completion credited twice or a silent DMA error
      feeds it a sample that is not current.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_stm32_critical::spi::tests::no_flags_have_no_action
        - level: unit

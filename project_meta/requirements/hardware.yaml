  - id: HW-DSHOT-007
    title: The outputs stay stopped through boot on the board
    statement: >-
      On the board, the DShot outputs shall stay stopped through boot and
      carry the arming sequence props-off.
    rationale: >-
      This is the motor output path (W1); a lane that misbehaves must stop
      the bank, never leave a motor on a guessed command (W2), and DShot

schema_version: 2
requirements:
  - id: OSD-001
    title: The OSD warns when its data stops updating
    statement: >-
      The OSD shall blink a "DATA STALE" warning on its own row while the
      observer's topic or the control loop's has held its sequence for 250
      ms by the OSD's clock, until both advance.
    rationale: >-
      A silently stalled observer leaves the OSD running with frozen values
      (section 19); the pilot must not read them as current.
    derived_from: [BORDER-003]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_osd::tests::data_stalls_when_the_observer_or_the_control_topic_holds
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_osd::tests::stale_data_blinks_a_warning_row_and_stale_battery_shows_dashes

  - id: OSD-002
    title: A stalled battery reading shows dashes
    statement: >-
      The OSD shall show dashes in place of the battery voltage, cell
      voltage and current while the battery's topic has held its sequence
      for 500 ms.
    rationale: >-
      The battery topic's limit is twice its 10 Hz period, and it also
      catches a battery reading that stopped, such as the ADC's after a DMA
      error.
    derived_from: [BORDER-003]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_osd::tests::the_battery_stalls_on_its_own_longer_limit
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_osd::tests::stale_data_blinks_a_warning_row_and_stale_battery_shows_dashes

  - id: OSD-003
    title: The OSD menu asks for each change
    statement: >-
      The OSD's tuning menu shall turn each edit into a request for the
      value it changed, and show the active configuration once the
      request's result arrives.
    rationale: >-
      The OSD is not safety-critical; a change it makes reaches the craft
      only through the coordinator's checks (CONFIG-023).
    derived_from: [CONFIG-023]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_osd::tests::a_menu_edit_becomes_the_request_for_its_row

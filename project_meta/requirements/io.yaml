schema_version: 2
requirements:
  - id: IO-001
    title: A serial chunk carries its bytes and their continuity
    statement: >-
      A received serial chunk shall carry its bytes in order, their
      arrival time, the port generation and whether a UART error was
      seen, and a constructed chunk shall never claim lost bytes before
      it, which only the reader marks; an empty or oversized chunk, in
      either direction, shall be refused; and every serial fault shall
      map to an embedded-io error kind.
    rationale: >-
      This is the contract every serial consumer reads (ADR-0011,
      ADR-0057): without the arrival time a consumer cannot judge a
      frame's age, and without the generation and the discontinuity mark
      it would join bytes across a gap.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::serial::tests::a_received_chunk_keeps_its_bytes_arrival_and_continuity
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::serial::tests::an_empty_or_oversized_chunk_is_refused
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::serial::tests::a_transmitted_chunk_round_trips
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::serial::tests::the_stream_generation_advances_and_wraps
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::serial::tests::serial_faults_map_to_embedded_io_kinds

  - id: IO-002
    title: Timestamps extend monotonically and deadlines expire on time
    statement: >-
      A wrapping hardware counter shall extend into a monotonic 64-bit
      count across its wrap, and a deadline shall expire exactly at its
      start plus its timeout, saturating rather than wrapping at the end
      of the range.
    rationale: >-
      Every message carries a timestamp, and every staleness decision
      compares against one; a wrap read backwards would make stale data
      look fresh.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::time::tests::wrapping_counter_extends_monotonic_ticks
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::time::tests::wrapping_counter_tracks_large_32_bit_period
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::time::tests::a_deadline_expires_at_its_timeout_and_saturates

  - id: IO-003
    title: A link never blocks its producer and shows what it lost
    statement: >-
      A link's producer shall never block: on a full queue it shall
      refuse the new message, keep the queued ones and count the refusal.
      It shall number every message it tries to send from 1, skipping 0
      when the number wraps, so a consumer reads a refused message as a
      gap in the sequence; a forwarded message shall keep its upstream
      sequence and timestamp. A consumer shall read an `event` link in
      order and a `state` link as its newest message, taking at most the
      queue's capacity, and an empty link shall read as nothing new.
    rationale: >-
      Every link between safety-critical tasks, and to the observer, is
      this queue (ADR-0055): a consumer that stalls must cost its
      producer data, never time (W2), and the loss must be visible.
      Staleness stays the consumer's decision.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::link::tests::a_full_link_refuses_the_new_message_and_keeps_the_queued_ones
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::link::tests::a_refused_message_leaves_a_gap_in_the_sequence
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::link::tests::newest_drains_to_the_latest_and_empty_means_nothing_new
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::link::tests::forward_keeps_the_upstream_stamp
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_io_contracts::link::tests::the_sequence_skips_zero_when_it_wraps

  - id: IO-004
    title: An IMU sample is one burst in one message
    statement: >-
      An IMU sample handed to the control loop shall carry the raw gyro
      counts, the acceleration, the rates and the temperature decoded from
      one burst, as one message over a `state` link, so its consumer never
      combines values from two samples.
    rationale: >-
      The control loop read its gyro as three atomics the parser wrote at a
      lower priority, and its accelerometer through a separate lock, so a
      tick could mix two samples (section 9, ADR-0057).
    derived_from: [W2]
    verification:
      entries: []

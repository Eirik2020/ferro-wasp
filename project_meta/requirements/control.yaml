schema_version: 2
requirements:
  - id: CTRL-001
    title: Centred sticks command zero
    statement: >-
      Centred sticks inside the deadband shall command zero rate.
    rationale: >-
      A reversed stick is a crash; command signs are controlled
      configuration.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::rc_mapping_clamps_deadbands_and_uses_axis_profiles
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: CTRL-014
    title: Sticks command the configured positive directions
    statement: >-
      Right roll, forward pitch and right yaw sticks shall command the
      controller's positive directions.
    rationale: >-
      A reversed stick is a crash; command signs are controlled
      configuration.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::rc_stick_commands_drive_expected_physical_motor_pairs
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: CTRL-002
    title: Correction opposes the imposed motion
    statement: >-
      On every axis, the rate controller's correction shall oppose an
      imposed motion, never reinforce it.
    rationale: >-
      A sign hidden anywhere between the IMU and the mixer turns
      stabilization into a runaway.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::measured_nose_up_pitch_rate_commands_rear_motors_up
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::measured_nose_down_pitch_rate_commands_front_motors_up
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::pid_roll_correction_mixes_to_opposite_motor_pairs
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: CTRL-015
    title: Nose-down gives positive controller pitch
    statement: >-
      Physical nose-down shall give positive controller pitch, a negative
      pitch PID, and front motors above rear.
    rationale: >-
      A sign hidden anywhere between the IMU and the mixer turns
      stabilization into a runaway.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::measured_nose_down_pitch_rate_commands_front_motors_up
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_board_foxeer_f405_v2::profiles::tests::imu_frame_profile_matches_the_measured_foxeer_orientation
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_board_foxeer_f405_v2::profiles::tests::measured_nose_up_rate_maps_negative_for_the_golden_controller
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_board_foxeer_f405_v2::profiles::tests::measured_nose_down_rate_maps_positive_for_the_golden_controller
        - level: bench
          target: fcu
          setup: props-off
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Powered Props-Off Exact-Image Gate

  - id: CTRL-003
    title: In flight, commands are tracked without oscillation or saturation
    statement: >-
      In a conservative hop, commanded roll, pitch and yaw rates shall be
      tracked without autonomous or command-excited oscillation, sustained
      mixer saturation or clipping, or reinforcing correction.
    rationale: >-
      Props-off checks cannot show flight readiness; only flight evidence
      can.
    derived_from: [W6, W7]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::mixer_rescales_axes_to_preserve_actuator_bounds
        - level: flight
          target: fcu
          setup: none
          method:
            procedure: project_meta/testing/targets/foxeer-f405-v2.md#Foxeer Conservative Logged-Hop Flight Test

  - id: CTRL-004
    title: The PID bounds its terms and output and does not wind up
    statement: >-
      The PID controller shall bound each term and its total output to their
      configured limits, keep a non-finite input or gain from reaching its
      output, stop growing the integral while the output saturates or while
      the setpoint changes faster than the relax rate, and take the
      derivative from the measurement, not the setpoint.
    rationale: >-
      An unbounded or non-finite controller output reaches the motors;
      integral windup and derivative kick are classic sources of a flip
      after a saturation or a stick step.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::proportional_output_tracks_error
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::total_output_is_clamped_symmetrically
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::integral_accumulates_and_respects_limit
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::integral_scales_with_dt_seconds
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::anti_windup_freezes_integral_when_output_is_saturated
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::anti_windup_allows_integral_to_unwind
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::derivative_is_zero_until_previous_error_exists
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::derivative_uses_measurement_not_setpoint
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::feedforward_tracks_setpoint_rate
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::i_term_relax_freezes_growth_during_fast_setpoint_changes
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::derivative_filter_smooths_d_term
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::reset_clears_derivative_history
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::pid::tests::non_finite_values_do_not_escape_to_output

  - id: CTRL-005
    title: Frame rotations are exact signed permutations
    statement: >-
      A frame rotation shall map each axis to exactly one axis with a sign
      of plus or minus one, and compose in the order applied.
    rationale: >-
      IMU orientation and signs are controlled configuration; a sign hidden
      in a rotation turns stabilization into a runaway.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::identity_preserves_axes
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::signed_axis_permutation_maps_values
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::composition_applies_second_rotation_after_first
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::imu_profile_composes_board_and_controller_frames

  - id: CTRL-016
    title: The controller convention inverts physical pitch only
    statement: >-
      The conversion between the physical body frame and the rate
      controller's convention shall invert physical pitch rate only.
    rationale: >-
      IMU orientation and signs are controlled configuration; a sign hidden
      in a rotation turns stabilization into a runaway.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::body_frame_names_the_control_convention
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::controller_compatibility_only_inverts_physical_pitch_rate
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::imu_profile_composes_board_and_controller_frames

  - id: CTRL-006
    title: The gyro low-pass starts at its first sample and smooths
    statement: >-
      The one-pole gyro low-pass shall start at its first sample and then
      move toward each input by its smoothing factor, on each axis
      independently.
    rationale: >-
      The gyro filter is controlled configuration stored as a corner
      frequency, so it must mean the same filter at every loop rate; a
      filter that lets a non-finite coefficient through corrupts every later
      sample.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::filter::tests::low_pass_filter_initializes_to_first_sample_then_smooths
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::filter::tests::imu_rate_filter_tracks_axes_independently

  - id: CTRL-017
    title: A corner frequency means the same filter at any rate
    statement: >-
      The smoothing factor computed for a corner frequency shall reproduce
      that corner at the given sample rate.
    rationale: >-
      The gyro filter is controlled configuration stored as a corner
      frequency, so it must mean the same filter at every loop rate; a
      filter that lets a non-finite coefficient through corrupts every later
      sample.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::the_default_corner_survives_the_current_loop_rate

  - id: CTRL-018
    title: An invalid corner or rate gives no filtering
    statement: >-
      A non-finite or non-positive corner or rate shall give no filtering
      rather than an invalid coefficient.
    rationale: >-
      The gyro filter is controlled configuration stored as a corner
      frequency, so it must mean the same filter at every loop rate; a
      filter that lets a non-finite coefficient through corrupts every later
      sample.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::filter::tests::a_non_finite_or_non_positive_corner_or_rate_gives_no_filtering

  - id: CTRL-019
    title: A notch attenuates its centre and passes the rest
    statement: >-
      A notch shall attenuate its centre frequency and pass frequencies away
      from it.
    rationale: >-
      The gyro filter is controlled configuration stored as a corner
      frequency, so it must mean the same filter at every loop rate; a
      filter that lets a non-finite coefficient through corrupts every later
      sample.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::rpm_filter::tests::each_harmonic_of_the_motor_is_notched
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::rpm_filter::tests::stick_frequencies_pass_through

  - id: CTRL-007
    title: The attitude estimate integrates rates and corrects toward gravity
    statement: >-
      The attitude estimator shall integrate the body rates over each sample
      interval and, on roll and pitch, blend the result toward the angles
      gravity gives by the complementary weight.
    rationale: >-
      The estimate drives the OSD horizon and the blackbox now and the
      stabilized mode next (requirements design section 15).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::attitude::tests::gyro_integrator_accumulates_rates_and_uses_accel_correction

  - id: CTRL-020
    title: Gravity gives the expected static attitude
    statement: >-
      Level gravity shall read zero roll and pitch, and gravity along the
      right axis ninety degrees of roll.
    rationale: >-
      The estimate drives the OSD horizon and the blackbox now and the
      stabilized mode next (requirements design section 15).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::attitude::tests::accelerometer_roll_pitch_have_expected_static_orientations

  - id: CTRL-008
    title: In rate mode, an estimator fault does not affect motor output
    statement: >-
      In rate mode, a fault in the attitude estimator, including a
      non-finite estimate, shall not change motor output.
    rationale: >-
      The estimator is classified safety-critical because stabilized mode is
      next, but in rate mode it feeds only the OSD horizon and the blackbox;
      this is the one estimator requirement until angle mode is built
      (requirements design section 15).
    derived_from: [W2]
    verification:
      entries: []

  - id: CTRL-009
    title: Gyro bias calibration accepts only a still craft
    statement: >-
      Gyro bias calibration shall average only fresh samples taken while
      disarmed, restarting its window on motion, and then subtract the bias.
    rationale: >-
      A bias learned while moving, or a level learned on a tilt, is a
      guessed state that biases every later rate or attitude.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::calibration::tests::gyro_bias_calibrator_resets_on_motion_and_subtracts_bias
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::calibration::tests::stale_samples_do_not_advance_gyro_bias_calibration

  - id: CTRL-021
    title: Accelerometer level calibration accepts only a still, level craft
    statement: >-
      Accelerometer level calibration shall refuse a craft that moves, leans
      more than 10 degrees, or reads gravity at the wrong magnitude.
    rationale: >-
      A bias learned while moving, or a level learned on a tilt, is a
      guessed state that biases every later rate or attitude.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::calibration::accel_level::tests::a_still_board_mounted_slightly_off_is_corrected_to_level
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::calibration::accel_level::tests::movement_tilt_and_a_wrong_scale_are_refused

  - id: CTRL-022
    title: Stored level offsets are bounded
    statement: >-
      Stored accelerometer level offsets shall stay within their bound.
    rationale: >-
      A bias learned while moving, or a level learned on a tilt, is a
      guessed state that biases every later rate or attitude.
    derived_from: [W2, W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::calibration::accel_level::tests::stored_offsets_are_bounded

  - id: CTRL-010
    title: Sticks are shaped by the rate profile
    statement: >-
      The flight controller shall shape each stick by its rate profile and
      deadband, with centre sensitivity and maximum rate independent.
    rationale: >-
      This is the path from the pilot's sticks to motor output; its signs,
      gains, rates and motor order are controlled configuration (W6).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::actual_rates_keep_center_sensitivity_and_max_rate_independent
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::rc_mapping_clamps_deadbands_and_uses_axis_profiles
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::runtime_rc_profile_changes_deadband_sensitivity_and_axis_limits

  - id: CTRL-023
    title: One PID per axis on the measured rate
    statement: >-
      The flight controller shall run one PID per axis on the measured rate,
      with feedforward, exposing each axis's contributions.
    rationale: >-
      This is the path from the pilot's sticks to motor output; its signs,
      gains, rates and motor order are controlled configuration (W6).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::gyro_axis_map_preserves_current_control_convention
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::first_hop_profile_disables_integral_during_p_only_tuning
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::pid_zero_error_keeps_all_motors_at_throttle
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::pid_contributions_are_exposed_per_axis
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::feedforward_and_blackbox_sample_track_rate_setpoint_changes

  - id: CTRL-024
    title: The mixer opposes motion and keeps actuator bounds
    statement: >-
      The mixer shall map the corrections to the motors so that the
      correction opposes the motion and the actuator bounds hold.
    rationale: >-
      This is the path from the pilot's sticks to motor output; its signs,
      gains, rates and motor order are controlled configuration (W6).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::pid_roll_correction_mixes_to_opposite_motor_pairs
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::measured_nose_up_pitch_rate_commands_rear_motors_up
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::measured_nose_down_pitch_rate_commands_front_motors_up
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::mixer_rescales_axes_to_preserve_actuator_bounds

  - id: CTRL-025
    title: Logical motors map to outputs in bench order
    statement: >-
      The flight controller shall map logical to physical motors in the
      measured bench order.
    rationale: >-
      This is the path from the pilot's sticks to motor output; its signs,
      gains, rates and motor order are controlled configuration (W6).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::rc_stick_commands_drive_expected_physical_motor_pairs
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::motor_output_map_matches_measured_bench_order
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::dshot_unequal_bench_pattern_is_bounded_remapped_and_triggered

  - id: CTRL-026
    title: A reset clears the controller's state
    statement: >-
      A reset shall clear the flight controller's PID history, setpoints and
      outputs.
    rationale: >-
      This is the path from the pilot's sticks to motor output; its signs,
      gains, rates and motor order are controlled configuration (W6).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::reset_control_state_clears_pid_history_setpoints_and_outputs

  - id: CTRL-027
    title: The control rate divides the scheduler tick exactly
    statement: >-
      The flight controller shall run only at a control rate its scheduler
      tick divides exactly.
    rationale: >-
      This is the path from the pilot's sticks to motor output; its signs,
      gains, rates and motor order are controlled configuration (W6).
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::the_divider_check_rejects_an_inexact_pair
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::drone_toolbox::tests::the_default_corner_survives_the_current_loop_rate

  - id: CTRL-011
    title: Dynamic idle is off by default and refuses invalid settings
    statement: >-
      Dynamic idle shall be off by default and refuse invalid settings.
    rationale: >-
      Dynamic idle changes motor output from motor feedback; stale feedback
      must never push the floor up.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::off_by_default
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::invalid_settings_are_refused
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::reset_starts_over

  - id: CTRL-028
    title: Dynamic idle raises all four motors toward the slowest's target
    statement: >-
      When on, dynamic idle shall raise the floor of all four motors
      together to bring the slowest motor to its target speed, with
      Betaflight's gains and its fast-rising, slow-falling I-term.
    rationale: >-
      Dynamic idle changes motor output from motor feedback; stale feedback
      must never push the floor up.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::gains_scale_as_betaflights
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::the_loop_brings_the_slowest_motor_to_its_target
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::motors_above_target_need_no_increase
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::the_i_term_rises_fast_and_falls_slowly
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::a_falling_motor_speed_pushes_through_the_d_term

  - id: CTRL-029
    title: The dynamic idle increase is bounded
    statement: >-
      The dynamic idle increase shall stay below the configured maximum and,
      before throttle is first raised, below static idle.
    rationale: >-
      Dynamic idle changes motor output from motor feedback; stale feedback
      must never push the floor up.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::before_throttle_is_raised_the_floor_stops_at_static_idle
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::after_throttle_is_raised_the_floor_stops_at_the_maximum

  - id: CTRL-030
    title: Stale eRPM never raises the floor
    statement: >-
      While any eRPM is stale, dynamic idle shall hold its increase without
      integrating, then decay it to static idle, never winding it past
      static idle, and resume from where the decay left off once eRPM is
      fresh.
    rationale: >-
      Dynamic idle changes motor output from motor feedback; stale feedback
      must never push the floor up.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::stale_erpm_holds_the_increase_without_integrating
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::dynamic_idle::tests::stale_erpm_then_decays_the_increase_to_static_idle
        - level: unit
          target: host
          setup: none

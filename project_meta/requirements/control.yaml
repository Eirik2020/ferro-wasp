  - id: CTRL-011
    title: Dynamic idle raises the motor floor as Betaflight does, and stale eRPM never raises it
    statement: >-
      Dynamic idle shall be off by default and refuse invalid settings;
      when on, it shall raise the floor of all four motors together to
      bring the slowest motor to its target speed, with Betaflight's
      gains and its fast-rising, slow-falling I-term, never above the
      configured maximum and, before throttle is raised, never above
      static idle; and while any eRPM is stale it shall hold the
      increase without integrating, then decay it to static idle, never
      wind it up past static idle, and resume from where the decay left
      off once eRPM is fresh.
    rationale: >-
      Dynamic idle changes motor output from motor feedback; stale
      feedback must never push the floor up.
    derived_from: [W2]
    verification:
      entries:
        - level: unit
          target: host
          setup: none

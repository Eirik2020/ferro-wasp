  - id: CTRL-013
    title: The control loop takes the newest IMU sample
    statement: >-
      On each control tick the control loop shall take the newest IMU sample
      from its link, reusing the last one when nothing new arrived.
    rationale: >-
      This task wires the host-tested rate controller, the stale-IMU rule
      (SAFETY-011) and the pre-arm status (SAFETY-005) together; its
      evidence is on the board.
    derived_from: [W1, W2]
    verification:
      entries: []

  - id: CTRL-035
    title: A stale tick holds, and a second disarms
    statement: >-
      The control loop shall ride out one isolated stale tick holding the
      previous motor command, and request a disarm on a stale tick beyond
      that tolerance while armed.
    rationale: >-
      This task wires the host-tested rate controller, the stale-IMU rule
      (SAFETY-011) and the pre-arm status (SAFETY-005) together; its
      evidence is on the board.
    derived_from: [W1, W2]
    verification:
      entries: []

  - id: CTRL-036
    title: Motor commands are published only while armed
    statement: >-
      The control loop shall publish motor commands only while armed.
    rationale: >-
      This task wires the host-tested rate controller, the stale-IMU rule
      (SAFETY-011) and the pre-arm status (SAFETY-005) together; its
      evidence is on the board.
    derived_from: [W1, W2]
    verification:
      entries: []

  - id: CTRL-037
    title: Every tick is reported
    statement: >-
      On every exit path the control loop shall report the tick to the
      observer and its IMU status to both pre-arm checks.
    rationale: >-
      This task wires the host-tested rate controller, the stale-IMU rule
      (SAFETY-011) and the pre-arm status (SAFETY-005) together; its
      evidence is on the board.
    derived_from: [W1, W2]
    verification:
      entries: []

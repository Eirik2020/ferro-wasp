  - id: CTRL-034
    title: Every notch refreshes within a millisecond
    statement: >-
      The RPM filter shall refresh every notch within a millisecond, and
      neither refresh nor apply a zero-weight harmonic.
    rationale: >-
      The RPM filter shapes the gyro signal the rate loop flies on; a notch
      misplaced on a stick frequency would cut the pilot's own commands.

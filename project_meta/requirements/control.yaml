  - id: CTRL-012
    title: The RPM filter notches each motor's harmonics as Betaflight does
    statement: >-
      The RPM filter shall default to Betaflight's settings and refuse
      invalid ones; it shall turn eRPM into mechanical frequency through
      the pole pairs, smoothed by a 150 Hz PT1 and held while eRPM is
      held; it shall place one notch per motor and harmonic, pass the
      gyro unchanged with no harmonics and pass stick frequencies, fade
      notches out below the minimum frequency, stop them short of
      Nyquist, refresh every notch within a millisecond, and neither
      refresh nor apply a zero-weight harmonic.
    rationale: >-
      The RPM filter shapes the gyro signal the rate loop flies on; a
      notch misplaced on a stick frequency would cut the pilot's own
      commands.
    derived_from: [W6]
    verification:
      entries:
        - level: unit

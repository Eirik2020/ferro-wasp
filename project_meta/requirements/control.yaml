  - id: CTRL-005
    title: Frame rotations are exact signed permutations
    statement: >-
      A frame rotation shall map each axis to exactly one axis with a
      sign of plus or minus one and compose in the order applied, and
      the conversion between the physical body frame and the rate
      controller's convention shall invert physical pitch rate only.
    rationale: >-
      IMU orientation and signs are controlled configuration; a sign
      hidden in a rotation turns stabilization into a runaway.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::frames::tests::identity_preserves_axes
        - level: unit

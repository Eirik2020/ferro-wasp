        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::rpm_filter::tests::motor_frequency_is_smoothed_by_a_150_hz_pt1
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::rpm_filter::tests::a_held_erpm_holds_the_frequency

  - id: CTRL-032
    title: One notch per motor and harmonic
    statement: >-
      The RPM filter shall place one notch per motor and harmonic, passing
      the gyro unchanged with no harmonics and passing stick frequencies.
    rationale: >-
      The RPM filter shapes the gyro signal the rate loop flies on; a notch
      misplaced on a stick frequency would cut the pilot's own commands.

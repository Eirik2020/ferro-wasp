  - id: CTRL-033
    title: Notches fade below the minimum and stop short of Nyquist
    statement: >-
      RPM filter notches shall fade out below the minimum frequency and stop
      short of Nyquist.
    rationale: >-
      The RPM filter shapes the gyro signal the rate loop flies on; a notch
      misplaced on a stick frequency would cut the pilot's own commands.
    derived_from: [W6]
    verification:

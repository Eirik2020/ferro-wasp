  - id: CTRL-012
    title: The RPM filter defaults to Betaflight's settings
    statement: >-
      The RPM filter shall default to Betaflight's settings and refuse
      invalid ones.
    rationale: >-
      The RPM filter shapes the gyro signal the rate loop flies on; a notch
      misplaced on a stick frequency would cut the pilot's own commands.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::rpm_filter::tests::defaults_are_betaflights_and_valid
        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_flight_control::rpm_filter::tests::invalid_settings_are_refused

  - id: CTRL-031
    title: eRPM becomes a smoothed mechanical frequency
    statement: >-
      The RPM filter shall turn eRPM into mechanical frequency through the
      pole pairs, smoothed by a 150 Hz PT1 and held while eRPM is held.
    rationale: >-
      The RPM filter shapes the gyro signal the rate loop flies on; a notch
      misplaced on a stick frequency would cut the pilot's own commands.
    derived_from: [W6]
    verification:
      entries:
        - level: unit
          target: host
          setup: none
          method:

        - level: unit
          target: host
          setup: none
          method:
            test: ferrowasp_control::calibration::accel_level::tests::stored_offsets_are_bounded

  - id: CTRL-010
    title: The flight controller turns sticks and rates into bounded motor commands
    statement: >-
      The flight controller shall shape each stick by its rate profile
      and deadband with centre sensitivity and maximum rate independent,
      run one PID per axis on the measured rate with feedforward and
      expose each axis's contributions, mix them to the motors so that
      the correction opposes the motion and the actuator bounds hold,
      map logical to physical motors in the measured bench order, clear
      its state on a reset, and run only at a control rate its scheduler
      tick divides exactly.
    rationale: >-
      This is the path from the pilot's sticks to motor output; its
      signs, gains, rates and motor order are controlled configuration
      (W6).

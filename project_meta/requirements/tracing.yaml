schema_version: 2
requirements:
  - id: TRACE-001
    title: Every safety-critical module declares a requirement
    statement: >-
      Every safety-critical source file that defines code shall declare at
      least one requirement that it implements.
    rationale: >-
      Code that serves no stated requirement has nothing its evidence could
      prove, so it cannot be shown safe (W7).
    derived_from: [W7]
    verification:
      entries: []

  - id: TRACE-002
    title: Safety-critical modules import only verified code
    statement: >-
      A safety-critical source file shall import only other safety-critical
      source files and external crates pinned to one version.
    rationale: >-
      Critical evidence must not rest on code that owes no evidence, nor on a
      dependency that can change without an edit anyone sees (W4).
    derived_from: [W4]
    verification:
      entries: []

  - id: TRACE-003
    title: A module's identity ignores layout and comments
    statement: >-
      A source file's identity shall be a hash of its tokens that ignores
      whitespace and comments.
    rationale: >-
      Reformatting or documenting code changes no behaviour, and must not
      re-owe the evidence for it (W7).
    derived_from: [W7]
    verification:
      entries: []

  - id: TRACE-004
    title: Evidence covers a file and its pinned crates
    statement: >-
      Evidence for a source file shall stand exactly while the file's identity
      and the version of each external crate it directly imports are unchanged.
    rationale: >-
      A part that fulfils the same requirements owes only its own evidence, so a
      fix in one module does not reopen the modules above it (W7).
    derived_from: [W7]
    verification:
      entries: []

  - id: TRACE-009
    title: Changing what a requirement sets re-owes it
    statement: >-
      A requirement's evidence shall go stale when the statement of a requirement
      derived from it changes.
    rationale: >-
      The requirements a layer sets are its interface to the layer below, so
      changing that interface is the one change that climbs upward (W7).
    derived_from: [W7]
    verification:
      entries: []

  - id: TRACE-010
    title: Evidence does not depend on the compiler
    statement: >-
      Evidence shall not depend on the compiler version.
    rationale: >-
      Differences between compiler versions are negligible outside safety
      assurance, which this project does not claim, and a compiler bump must not
      reopen everything.
    derived_from: [W7]
    verification:
      entries: []

  - id: TRACE-008
    title: Host evidence covers every file a host test can reach
    statement: >-
      A requirement's host evidence shall stand only while each declaring file
      a host test build compiles is exercised by at least one of its passing
      tests.
    rationale: >-
      One test rarely reaches every file that implements a requirement, and a
      task definition cannot be reached from the host at all, so target-level
      evidence judges those files (W7).
    derived_from: [W7, TRACE-004]
    verification:
      entries: []

  - id: TRACE-005
    title: A configuration's identity is which car it is
    statement: >-
      A configuration's identity shall consist of the paths of its compiled-in
      source files, the content of its app shell and of its files that are not
      Rust source, its feature set and its external crate versions.
    rationale: >-
      Timing faults come from scheduling as well as from code, so evidence for a
      configuration must notice a priority or binding change, and the shell holds
      them; a part's content has its own evidence (W7).
    derived_from: [W7]
    verification:
      entries: []

  - id: TRACE-006
    title: Maturity is reported per configuration
    statement: >-
      For each configuration, reqtool shall report the status of every
      requirement declared by the safety-critical source files compiled into
      it.
    rationale: >-
      A release must show what evidence covers the image it ships, including
      modules a feature pulls in that have no evidence (W7).
    derived_from: [W7]
    verification:
      entries: []

  - id: TRACE-007
    title: Board evidence follows the configuration and its own parts
    statement: >-
      Board evidence shall count while its configuration's identity is the one
      recorded and the files declaring its requirement are unchanged.
    rationale: >-
      A run proves the car that ran; replacing a part owes that part's evidence,
      not the whole car's (W7).
    derived_from: [W7]
    verification:
      entries: []

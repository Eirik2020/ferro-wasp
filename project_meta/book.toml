# The internal book: maintainers and agents only, never published. It builds
# into the gitignored target directory. The archive is never listed in
# SUMMARY.md, and mdBook copies only non-Markdown files from the source, so
# archived documents stay out of the build.
[book]
title = "FerroWasp Internal"
language = "en"
src = "."

[build]
build-dir = "../target/internal-book"
create-missing = false
# Keep README.md as README.html so source links work in the build too.
use-default-preprocessors = false

[output.html]
search.enable = true

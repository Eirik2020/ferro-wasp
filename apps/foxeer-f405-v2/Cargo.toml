[package]
name = "ferrowasp-app-foxeer-f405-v2"
version = "0.1.0"
authors = ["Kaldstrand <63415376+Eirik2020@users.noreply.github.com>"]
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[workspace]
resolver = "2"

[[bin]]
name = "FerroWaspFoxeerF405V2"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["board-foxeer-f405-v2", "dshot"]
board-foxeer-f405-v2 = ["ferrowasp-bsp/foxeer-f405-v2"]
blackbox_defmt = ["ferrowasp-tasks/blackbox_defmt"]
bench_actuator_validation = []
bench_equal_motors = []
bench_motor1_only = ["ferrowasp-core/bench_motor1_only"]
bench_motor2_only = ["ferrowasp-core/bench_motor2_only"]
bench_motor3_only = ["ferrowasp-core/bench_motor3_only"]
bench_motor4_only = ["ferrowasp-core/bench_motor4_only"]
bench_logical_motor1_only = ["ferrowasp-core/bench_logical_motor1_only"]
bench_logical_motor2_only = ["ferrowasp-core/bench_logical_motor2_only"]
bench_logical_motor3_only = ["ferrowasp-core/bench_logical_motor3_only"]
bench_logical_motor4_only = ["ferrowasp-core/bench_logical_motor4_only"]
imu_transport_rtt = []
imu_orientation_rtt = ["imu_transport_rtt"]
smoke_actuator_inhibit = []
bench_motor_cmd_stale_rejection = []
bench_prearm_imu_stale = []
bench_spi_timeout_recovery = ["ferrowasp-stm32f4/bench_spi_timeout_recovery"]
dshot = ["ferrowasp-bsp/foxeer-f405-v2-dshot-four", "esc_telemetry"]
esc_telemetry = []
bench_dshot_idle_output1_not_running = []
flash_storage = ["usb_serial"]
flash_writes = ["flash_storage"]
flash_blackbox = ["flash_writes"]
pwm_cal = []
usb_serial = []

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
critical-section = "1.2.0"
defmt = "1.0.1"
defmt-rtt = { version = "1.2.0", features = ["disable-blocking-mode"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
ferrowasp-bsp = { path = "../../crates/ferrowasp-bsp", default-features = false }
ferrowasp-core = { path = "../../crates/ferrowasp-core" }
ferrowasp-drivers = { path = "../../crates/ferrowasp-drivers" }
ferrowasp-io-core = { path = "../../crates/ferrowasp-io-core" }
ferrowasp-mspv1 = { path = "../../crates/ferrowasp-mspv1" }
ferrowasp-pid = { path = "../../crates/ferrowasp-pid" }
ferrowasp-stm32f4 = { path = "../../crates/ferrowasp-stm32f4" }
ferrowasp-tasks = { path = "../../crates/ferrowasp-tasks" }
ferrowasp-waveform = { path = "../../crates/ferrowasp-waveform" }
heapless = "0.9.2"
nb = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rtic = { version = "2.2.0", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.1.0", features = ["cortex-m-systick"] }
sbus-rs = "0.1.3"
stm32f4xx-hal = { git = "https://github.com/stm32-rs/stm32f4xx-hal.git", rev = "78d79609137d5c380320f7bf1a9120967babc61d", features = ["stm32f405", "rtic2", "defmt", "usb_fs", "uart4"] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = true
incremental = false
lto = true
opt-level = "s"

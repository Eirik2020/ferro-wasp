[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
publish = false

[workspace]
resolver = "2"

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive"] }
defmt = "=1.0.1"
embedded-io-async = "=0.7.0"
ferrowasp-core = { path = "../../crates/ferrowasp-core" }
ferrowasp-drivers = { path = "../../crates/ferrowasp-drivers" }
ferrowasp-io-core = { path = "../../crates/ferrowasp-io-core" }
ferrowasp-mspv1 = { path = "../../crates/ferrowasp-mspv1" }
ferrowasp-stm32f4 = { path = "../../crates/ferrowasp-stm32f4" }
ferrowasp-tasks = { path = "../../crates/ferrowasp-tasks" }
fugit = "=0.3.9"
heapless = "=0.9.2"
hex = "=0.4.3"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = { version = "=1.0.228", features = ["derive"] }
serde_path_to_error = "=0.1.20"
sha2 = "=0.10.9"
stm32f4xx-hal = { git = "https://github.com/stm32-rs/stm32f4xx-hal.git", rev = "78d79609137d5c380320f7bf1a9120967babc61d", features = ["stm32f405", "uart4"] }
syn = { version = "=2.0.119", features = ["full", "parsing", "visit"] }
toml = "=0.8.23"

[dev-dependencies]
tempfile = "=3.27.0"

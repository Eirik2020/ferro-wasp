[workspace]
members = ["task-check", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "=1.0.103"
defmt = "=1.0.1"
embedded-hal = "=1.0.0"
fugit = "=0.3.9"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "parsing", "visit"] }

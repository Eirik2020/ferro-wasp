[workspace]
resolver = "2"
members = [
    "crates/ferro-configurator-core",
    "crates/ferro-configurator-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eirik2020/ferro-wasp"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serialport = { version = "4.7", default-features = false }
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

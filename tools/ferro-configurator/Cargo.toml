[workspace]
resolver = "2"
members = [
    "crates/ferro-configurator-core",
    "crates/ferro-configurator-cli",
    "crates/ferro-configurator-bridge",
    "crates/ferro-configurator-ble",
]
exclude = ["gui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eirik2020/ferro-wasp"
rust-version = "1.88"

[workspace.dependencies]
btleplug = "0.13"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serialport = { version = "4.7", default-features = false }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
toml = "0.9"
uuid = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

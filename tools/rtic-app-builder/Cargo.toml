[workspace]
members = ["xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_path_to_error = "=0.1.20"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full", "parsing"] }
tempfile = "=3.27.0"
toml = "=0.8.23"

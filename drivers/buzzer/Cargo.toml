[package]
name = "buzzer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A bounded, allocation-free beeper driver for no_std flight controllers over an embedded-hal output pin"
keywords = ["buzzer", "beeper", "no-std", "embedded", "gpio"]
categories = ["embedded", "no-std", "hardware-support"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
embedded-hal = { workspace = true }

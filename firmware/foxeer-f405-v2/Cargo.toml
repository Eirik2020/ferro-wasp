[package]
name = "ferrowasp-app-foxeer-f405-v2"
version = "0.1.0"
authors = ["Kaldstrand <63415376+Eirik2020@users.noreply.github.com>"]
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"

[workspace]
resolver = "2"
exclude = ["board"]

[[bin]]
name = "FerroWaspFoxeerF405V2"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["board-foxeer-f405-v2"]
board-foxeer-f405-v2 = ["ferrowasp-ferrohal/stm32f405", "ferrowasp-ferrohal/dshot", "ferrowasp-stm32-app/stm32f405", "ferrowasp-stm32-app/dshot"]
bench_actuator_validation = []
bench_blackbox = ["ferrowasp-stm32-app/bench_blackbox"]
bench_config_fault = ["ferrowasp-stm32-app/bench_config_fault"]
bench_equal_motors = ["ferrowasp-stm32-app/bench_equal_motors"]
bench_motor1_only = ["ferrowasp-safety/bench_motor1_only", "ferrowasp-stm32-app/bench_motor1_only"]
bench_motor2_only = ["ferrowasp-safety/bench_motor2_only", "ferrowasp-stm32-app/bench_motor2_only"]
bench_motor3_only = ["ferrowasp-safety/bench_motor3_only", "ferrowasp-stm32-app/bench_motor3_only"]
bench_motor4_only = ["ferrowasp-safety/bench_motor4_only", "ferrowasp-stm32-app/bench_motor4_only"]
bench_logical_motor1_only = ["ferrowasp-safety/bench_logical_motor1_only", "ferrowasp-stm32-app/bench_logical_motor1_only"]
bench_logical_motor2_only = ["ferrowasp-safety/bench_logical_motor2_only", "ferrowasp-stm32-app/bench_logical_motor2_only"]
bench_logical_motor3_only = ["ferrowasp-safety/bench_logical_motor3_only", "ferrowasp-stm32-app/bench_logical_motor3_only"]
bench_logical_motor4_only = ["ferrowasp-safety/bench_logical_motor4_only", "ferrowasp-stm32-app/bench_logical_motor4_only"]
imu_transport_rtt = ["ferrowasp-stm32-app/imu_transport_rtt"]
imu_orientation_rtt = ["imu_transport_rtt", "ferrowasp-stm32-app/imu_orientation_rtt"]
smoke_actuator_inhibit = []
bench_motor_cmd_stale_rejection = ["ferrowasp-stm32-app/bench_motor_cmd_stale_rejection"]
bench_prearm_imu_stale = []
bench_spi_timeout_recovery = ["ferrowasp-stm32/bench_spi_timeout_recovery"]
bench_dshot_idle_output1_not_running = ["ferrowasp-stm32-app/bench_dshot_idle_output1_not_running"]
mspv2_configurator = ["ferrowasp-cli/mspv2_configurator", "ferrowasp-stm32-app/mspv2_configurator"]

[dependencies]
ferrowasp-icm42688p = { path = "../../crates/ferrowasp-icm42688p" }
ferrowasp-mpu6000 = { path = "../../crates/ferrowasp-mpu6000" }
ferrowasp-mpu6500 = { path = "../../crates/ferrowasp-mpu6500" }
ferrowasp-serial = { path = "../../crates/ferrowasp-serial" }
ferrowasp-storage = { path = "../../crates/ferrowasp-storage" }
ferrowasp-cli = { path = "../../crates/ferrowasp-cli" }
ferrowasp-control = { path = "../../crates/ferrowasp-control" }
ferrowasp-protocol = { path = "../../crates/ferrowasp-protocol" }
ferrowasp-safety = { path = "../../crates/ferrowasp-safety" }
ferrowasp-board-foxeer-f405-v2 = { path = "board" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
critical-section = "1.2.0"
defmt = "1.0.1"
defmt-rtt = { version = "1.2.0", features = ["disable-blocking-mode"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
ferrowasp-mspv1 = { path = "../../crates/ferrowasp-mspv1" }
ferrowasp-mspv2 = { path = "../../crates/ferrowasp-mspv2" }
ferrowasp-stm32 = { path = "../../crates/ferrowasp-stm32" }
ferrowasp-ferrohal = { path = "../../crates/ferrowasp-ferrohal" }
ferrowasp-stm32-app = { path = "../../crates/ferrowasp-stm32-app" }
ferroforge = "0.4"
heapless = "0.9.2"
nb = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.1.0", features = ["cortex-m-systick", "systick-64bit"] }
ferrohal-stm32 = { git = "https://github.com/Eirik2020/ferrohal-stm32", rev = "0914234e8c7f5eb5fc0618e620ea18de75de09c0", features = ["stm32f405rg", "rt", "defmt", "usb"] }


[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = true
incremental = false
lto = true
opt-level = "s"

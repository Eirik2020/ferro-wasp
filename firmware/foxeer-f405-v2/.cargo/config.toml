[target.thumbv7em-none-eabihf]
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]
runner = [
  "probe-rs", "run",
  "--chip", "STM32F405RG",
  "--protocol", "swd",
  # Logs read as a running commentary; drop the file and line from each line.
  "--no-location",
]

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"
CHIPSERIE = "stm32f405"

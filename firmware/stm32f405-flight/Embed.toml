[default.probe]
# USB vendor ID
# usb_vid = "1337"
# USB product ID
# usb_pid = "1337"
# Serial number
# serial = "12345678"
# The protocol to be used for communicating with the target.
protocol = "Swd"
# The speed in kHz of the data link to the target.
# speed = 1337

[default.flashing]
enabled = true


[default.reset]
enabled = true


[default.general]
chip = "STM32F405RG"

[default.rtt]
enabled = true
timeout = 7000
log_enabled = false
log_path = "./logs"



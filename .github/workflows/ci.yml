name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # The adoption work lives on its own branch until it merges, and CI is
    # what keeps it honest meanwhile.
    branches: [main, ferroforge-adoption]
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FIRMWARE_TARGET: thumbv7em-none-eabihf
  HOST_RUST_TOOLCHAIN: 1.93.1
  RUST_TOOLCHAIN: nightly-2026-07-13

jobs:
  firmware:
    name: Firmware check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.FIRMWARE_TARGET }}
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check reusable-crate formatting
        run: cargo fmt --all --check

      - name: Check STM32F405 flight-app formatting
        working-directory: firmware/stm32f405-flight
        run: cargo fmt --manifest-path Cargo.toml --check

      - name: Check STM32F401 bring-up formatting
        working-directory: firmware/stm32f401-bringup
        run: cargo fmt --manifest-path Cargo.toml --check

      - name: Check Foxeer F405 V2 formatting
        working-directory: firmware/foxeer-f405-v2
        run: cargo fmt --manifest-path Cargo.toml --check

      - name: Check TBS Lucid H7 formatting
        working-directory: firmware/tbs-lucid-h7
        run: cargo fmt --manifest-path Cargo.toml --check

      - name: Check embedded workspace
        run: >
          cargo check --workspace --locked --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-stm32f4/stm32f405,ferrowasp-stm32f4-tasks/stm32f405,ferrowasp-stm32f4-tasks/dshot

      - name: Lint embedded workspace
        run: >
          cargo clippy --workspace --locked --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-stm32f4/stm32f405,ferrowasp-stm32f4-tasks/stm32f405,ferrowasp-stm32f4-tasks/dshot
          -- -D warnings

      # FCU3 is obsolete: its gates are retired and no image ships. These
      # checks stay so the board keeps compiling against the shared crates and
      # a revival stays cheap.
      - name: Check standard STM32F405 DShot flight firmware
        working-directory: firmware/stm32f405-flight
        run: cargo check --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Lint standard STM32F405 DShot flight firmware
        working-directory: firmware/stm32f405-flight
        run: cargo clippy --locked --target ${{ env.FIRMWARE_TARGET }} -- -D warnings

      - name: Check firmware with USB serial
        working-directory: firmware/stm32f405-flight
        run: cargo check --locked --target ${{ env.FIRMWARE_TARGET }} --features usb_serial

      - name: Check STM32F401 bring-up firmware
        working-directory: firmware/stm32f401-bringup
        run: cargo check --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Lint STM32F401 bring-up firmware
        working-directory: firmware/stm32f401-bringup
        run: cargo clippy --locked --target ${{ env.FIRMWARE_TARGET }} -- -D warnings

      - name: Check Foxeer F405 V2 firmware
        working-directory: firmware/foxeer-f405-v2
        run: cargo check --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Lint Foxeer F405 V2 firmware
        working-directory: firmware/foxeer-f405-v2
        run: cargo clippy --locked --target ${{ env.FIRMWARE_TARGET }} -- -D warnings

      - name: Check Foxeer diagnostic features
        working-directory: firmware/foxeer-f405-v2
        run: >
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }}
          --features "blackbox_defmt bench_spi_timeout_recovery"

      - name: Check Foxeer equal-motor bench path
        working-directory: firmware/foxeer-f405-v2
        run: >
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }}
          --features "bench_actuator_validation blackbox_defmt bench_equal_motors"

      - name: Build Foxeer F405 V2 release firmware
        working-directory: firmware/foxeer-f405-v2
        run: cargo build --release --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Check embedded workspace for STM32H743
        run: >
          cargo check -p ferrowasp-stm32h7 -p ferrowasp-stm32f4-tasks --locked
          --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-stm32h7/stm32h743,ferrowasp-stm32f4-tasks/stm32h743,ferrowasp-stm32f4-tasks/dshot

      - name: Lint STM32H7 backend
        run: >
          cargo clippy -p ferrowasp-stm32h7 --locked --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-stm32h7/stm32h743
          -- -D warnings

      - name: Check TBS Lucid H7 firmware
        working-directory: firmware/tbs-lucid-h7
        run: cargo check --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Lint TBS Lucid H7 firmware
        working-directory: firmware/tbs-lucid-h7
        run: cargo clippy --locked --target ${{ env.FIRMWARE_TARGET }} -- -D warnings

      - name: Check TBS Lucid H7 diagnostic and bench features
        working-directory: firmware/tbs-lucid-h7
        run: |
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }} --features "blackbox_defmt bench_spi_timeout_recovery"
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }} --features "bench_actuator_validation blackbox_defmt bench_equal_motors"

      - name: Build TBS Lucid H7 release firmware
        working-directory: firmware/tbs-lucid-h7
        run: cargo build --release --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Upload Foxeer F405 V2 firmware ELF
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ferrowasp-foxeer-f405-v2-${{ github.sha }}-${{ env.FIRMWARE_TARGET }}
          path: firmware/foxeer-f405-v2/target/${{ env.FIRMWARE_TARGET }}/release/FerroWaspFoxeerF405V2
          if-no-files-found: error

  host-tests:
    name: Host workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test reusable crates
        run: >
          cargo test --workspace
          --locked
          --target x86_64-unknown-linux-gnu

      - name: Lint reusable crate targets
        run: >
          cargo clippy --workspace --all-targets
          --locked
          --target x86_64-unknown-linux-gnu
          -- -D warnings

      - name: Test Python analysis tools
        run: python -m unittest discover -s tools/tests -v

      - name: Check repository context budgets and document routing
        run: python tools/check_repository_context.py

      - name: Enforce thin RTIC and board-support boundaries
        run: python tools/check_rtic_boundaries.py

      - name: Validate release metadata
        run: python tools/release/check_release.py

      - name: Report embedded duplicate dependency versions
        run: cargo tree --workspace --duplicates --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Install unsafe-boundary audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Enforce isolated DShot and STM32H7 DMA unsafe boundaries
        shell: bash
        run: |
          # A missing directory must fail the audit, not shrink it: rg reports
          # a missing path and exits 2, which `|| true` below would swallow.
          # `apps/` became `firmware/` and was scanned for nothing until this.
          for scanned in crates firmware; do
            test -d "$scanned" || { echo "the unsafe audit expects ./$scanned"; exit 1; }
          done
          unsafe_matches="$(
            rg --line-number \
              '\bunsafe[[:space:]]+(impl|fn|trait|extern)|\bunsafe[[:space:]]*\{|allow\(unsafe_code\)|expect\(unsafe_code\)' \
              crates firmware --glob '*.rs' --glob '!**/target/**' || true
          )"
          unexpected="$(
            printf '%s\n' "$unsafe_matches" |
              rg --invert-match \
                '^(crates[/\\]ferrowasp-stm32f4[/\\]src[/\\]lib.rs:[0-9]+:#\[allow\(unsafe_code\)\]|crates[/\\]ferrowasp-stm32f4[/\\]src[/\\]dshot.rs:[0-9]+:[[:space:]]+unsafe impl (PeriAddress|DMASet)|crates[/\\]ferrowasp-stm32h7[/\\]src[/\\]lib.rs:[0-9]+:#\[allow\(unsafe_code\)\]|crates[/\\]ferrowasp-stm32h7[/\\]src[/\\]dma_endpoints.rs:[0-9]+:(unsafe impl(<[^>]*>)? TargetAddress<|[[:space:]]+let dma = unsafe \{ &\*I::ptr\(\) \};$))' ||
              true
          )"

          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "$unexpected"
            echo "unexpected workspace-owned unsafe source requires explicit review"
            exit 1
          fi

          # 3 for the F4 DShot boundary; 7 for the H7 DMA endpoints (the
          # module allow, five TargetAddress impls, one status-register read).
          if [[ "$(printf '%s\n' "$unsafe_matches" | rg --count '.')" -ne 10 ]]; then
            printf '%s\n' "$unsafe_matches"
            echo "the reviewed DShot or STM32H7 DMA unsafe boundary changed"
            exit 1
          fi

          rg --quiet '^#!\[deny\(unsafe_code\)\]$' crates/ferrowasp-stm32f4/src/lib.rs
          rg --quiet '^#!\[deny\(unsafe_op_in_unsafe_fn\)\]$' crates/ferrowasp-stm32f4/src/dshot.rs
          rg --quiet '^#!\[deny\(unsafe_code\)\]$' firmware/stm32f405-flight/src/main.rs
          rg --quiet '^#!\[deny\(unsafe_code\)\]$' firmware/foxeer-f405-v2/src/main.rs
          rg --quiet '^#!\[deny\(unsafe_code\)\]$' firmware/stm32f401-bringup/src/main.rs
          rg --quiet '^#!\[deny\(unsafe_code\)\]$' crates/ferrowasp-stm32h7/src/lib.rs
          rg --quiet '^#!\[deny\(unsafe_op_in_unsafe_fn\)\]$' crates/ferrowasp-stm32h7/src/dma_endpoints.rs
          rg --quiet '^#!\[deny\(unsafe_code\)\]$' firmware/tbs-lucid-h7/src/main.rs
          rg --quiet '^#!\[deny\(unsafe_code\)\]$' firmware/tbs-lucid-h7/src/lib.rs

  publication-security:
    name: Publication security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check public-history object sizes and suffixes
        run: python tools/release/check_public_history.py

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            /tmp/gitleaks.tar.gz | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz \
            --directory /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan complete reachable Git history
        run: >
          /tmp/gitleaks git
          --no-banner
          --redact
          --max-archive-depth 1
          --log-opts=--all
          .

  configurator:
    name: FerroConfigurator
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/ferro-configurator
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HOST_RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ferro-configurator

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check host workspace
        run: cargo check --workspace --locked

      - name: Test host workspace
        run: cargo test --workspace --locked

      - name: Lint host workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-release-package:
    name: Ready Windows package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, host-tests, publication-security, configurator, documentation]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Foxeer firmware
        uses: actions/download-artifact@v4
        with:
          name: ferrowasp-foxeer-f405-v2-${{ github.sha }}-${{ env.FIRMWARE_TARGET }}
          path: staging/foxeer-f405-v2

      - name: Install host Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HOST_RUST_TOOLCHAIN }}

      - name: Build FerroConfigurator
        working-directory: tools/ferro-configurator
        run: cargo build --release --locked -p ferro-configurator-cli

      - name: Validate release metadata
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python tools/release/check_release.py --tag "${{ github.ref_name }}"
          } else {
            python tools/release/check_release.py
          }

      - name: Assemble manifest-verified ready package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "0.1.0-${{ github.run_number }}"
          }
          ./tools/ferro-configurator/packaging/build-release.ps1 `
            -Version $version `
            -GitCommit "${{ github.sha }}" `
            -FirmwareElf "$env:GITHUB_WORKSPACE/staging/foxeer-f405-v2/FerroWaspFoxeerF405V2"

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: ferrowasp-ready-windows-x86_64
          path: tools/ferro-configurator/dist/*.zip*
          if-no-files-found: error

      - name: Publish tagged GitHub pre-release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FerroWasp ${{ github.ref_name }} — Experimental Foxeer F405 V2 Prototype
          body_path: .github/releases/${{ github.ref_name }}.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            tools/ferro-configurator/dist/*.zip
            tools/ferro-configurator/dist/*.zip.sha256

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2,mdbook-mermaid@0.17.0

      - name: Build book
        run: mdbook build mdbook

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FIRMWARE_TARGET: thumbv7em-none-eabihf
  HOST_RUST_TOOLCHAIN: 1.93.1
  RUST_TOOLCHAIN: nightly-2026-07-13

jobs:
  # A change confined to documentation and the requirements tool builds into
  # no firmware or host binary, so the jobs that build them are skipped for
  # it. Tags, manual runs and anything the diff cannot establish run all.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          code=true
          range=
          if [[ "$EVENT" == pull_request ]]; then
            range="$PR_BASE...$PR_HEAD"
          elif [[ "$EVENT" == push && "$REF_TYPE" == branch && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          if [[ -n "$range" ]]; then
            changed="$(git diff --name-only "$range")" || changed=
            printf '%s\n' "$changed"
            if [[ -n "$changed" ]] &&
              ! printf '%s\n' "$changed" |
                grep --quiet --extended-regexp --invert-match \
                  '^(project_meta/|mdbook/|tools/reqtool/|AGENTS\.md$|CLAUDE\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  firmware:
    name: Firmware check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.FIRMWARE_TARGET }}
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check reusable-crate formatting
        run: cargo fmt --all --check

      - name: Check Foxeer F405 V2 formatting
        working-directory: firmware/foxeer-f405-v2
        run: cargo fmt --manifest-path Cargo.toml --check

      - name: Check TBS Lucid H7 formatting
        working-directory: firmware/tbs-lucid-h7
        run: cargo fmt --manifest-path Cargo.toml --check

      - name: Check embedded workspace
        run: >
          cargo check --workspace --locked --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-ferrohal/stm32f405,ferrowasp-stm32-app/stm32f405,ferrowasp-stm32-app/dshot

      - name: Lint embedded workspace
        run: >
          cargo clippy --workspace --locked --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-ferrohal/stm32f405,ferrowasp-stm32-app/stm32f405,ferrowasp-stm32-app/dshot
          -- -D warnings

      - name: Check Foxeer F405 V2 firmware
        working-directory: firmware/foxeer-f405-v2
        run: cargo check --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Lint Foxeer F405 V2 firmware
        working-directory: firmware/foxeer-f405-v2
        run: cargo clippy --locked --target ${{ env.FIRMWARE_TARGET }} -- -D warnings

      - name: Check Foxeer diagnostic features
        working-directory: firmware/foxeer-f405-v2
        run: >
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }}
          --features "bench_spi_timeout_recovery"

      - name: Check Foxeer config-fault bench image
        working-directory: firmware/foxeer-f405-v2
        run: >
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }}
          --features "bench_config_fault"

      - name: Check Foxeer equal-motor bench path
        working-directory: firmware/foxeer-f405-v2
        run: >
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }}
          --features "bench_actuator_validation bench_equal_motors"

      - name: Build Foxeer F405 V2 release firmware
        working-directory: firmware/foxeer-f405-v2
        run: cargo build --release --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Check embedded workspace for STM32H743
        run: >
          cargo check -p ferrowasp-ferrohal -p ferrowasp-stm32-app --locked
          --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-ferrohal/stm32h743,ferrowasp-stm32-app/stm32h743,ferrowasp-stm32-app/dshot

      - name: Lint the backend for STM32H743
        run: >
          cargo clippy -p ferrowasp-ferrohal --locked --target ${{ env.FIRMWARE_TARGET }}
          --features ferrowasp-ferrohal/stm32h743
          -- -D warnings

      - name: Check TBS Lucid H7 firmware
        working-directory: firmware/tbs-lucid-h7
        run: cargo check --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Lint TBS Lucid H7 firmware
        working-directory: firmware/tbs-lucid-h7
        run: cargo clippy --locked --target ${{ env.FIRMWARE_TARGET }} -- -D warnings

      - name: Check TBS Lucid H7 diagnostic and bench features
        working-directory: firmware/tbs-lucid-h7
        run: |
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }} --features "bench_spi_timeout_recovery"
          cargo check --locked --target ${{ env.FIRMWARE_TARGET }} --features "bench_actuator_validation bench_equal_motors"

      - name: Build TBS Lucid H7 release firmware
        working-directory: firmware/tbs-lucid-h7
        run: cargo build --release --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Upload Foxeer F405 V2 firmware ELF
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ferrowasp-foxeer-f405-v2-${{ github.sha }}-${{ env.FIRMWARE_TARGET }}
          path: firmware/foxeer-f405-v2/target/${{ env.FIRMWARE_TARGET }}/release/FerroWaspFoxeerF405V2
          if-no-files-found: error

  host-tests:
    name: Host workspace tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # One entry point, the same one used locally: the root workspace, the
      # tests its feature unification compiles out, the bring-up app's board
      # manifest, and the Python tools. The Python tools read the documents,
      # so they run for every change.
      - name: Test reusable crates and feature-gated tests
        if: needs.changes.outputs.code == 'true'
        run: python tools/run_tests.py rust rust-features

      - name: Test Python tools
        run: python tools/run_tests.py python

      - name: Lint reusable crate targets
        if: needs.changes.outputs.code == 'true'
        run: >
          cargo clippy --workspace --all-targets
          --locked
          --target x86_64-unknown-linux-gnu
          -- -D warnings

      - name: Check repository context budgets and document routing
        run: python tools/check_repository_context.py

      - name: Enforce thin RTIC and board-support boundaries
        run: python tools/check_rtic_boundaries.py

      - name: Validate release metadata
        run: python tools/release/check_release.py

      - name: Report embedded duplicate dependency versions
        if: needs.changes.outputs.code == 'true'
        run: cargo tree --workspace --duplicates --locked --target ${{ env.FIRMWARE_TARGET }}

      - name: Install unsafe-boundary audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Enforce that FerroWasp has no unsafe code of its own
        shell: bash
        run: |
          # rg exits 1 when nothing matches. Anything above that means it didn't
          # scan: a missing path, or no rg at all. That fails the audit.
          rg_status=0
          unsafe_matches="$(
            rg --line-number \
              '\bunsafe[[:space:]]+(impl|fn|trait|extern)|\bunsafe[[:space:]]*\{|allow\(unsafe_code\)' \
              crates firmware --glob '*.rs' --glob '!**/target/**'
          )" || rg_status=$?
          if [[ "$rg_status" -gt 1 ]]; then
            echo "the unsafe audit did not run: rg exited $rg_status"
            exit 1
          fi
          if [[ -n "$unsafe_matches" ]]; then
            printf '%s\n' "$unsafe_matches"
            echo "FerroWasp has no unsafe code; a chip's unsafe belongs in FerroHAL, or needs review"
            exit 1
          fi

          for crate in \
            crates/ferrowasp-stm32/src/lib.rs \
            crates/ferrowasp-stm32-critical/src/lib.rs \
            crates/ferrowasp-ferrohal/src/lib.rs \
            crates/ferrowasp-ferrohal-critical/src/lib.rs \
            firmware/foxeer-f405-v2/src/main.rs \
            firmware/tbs-lucid-h7/src/main.rs \
            firmware/tbs-lucid-h7/src/lib.rs; do
            rg --quiet '^#!\[deny\(unsafe_code\)\]$' "$crate"
          done

  publication-security:
    name: Publication security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check public-history object sizes and suffixes
        run: python tools/release/check_public_history.py

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            /tmp/gitleaks.tar.gz | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz \
            --directory /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan complete reachable Git history
        run: >
          /tmp/gitleaks git
          --no-banner
          --redact
          --max-archive-depth 1
          --log-opts=--all
          .

  configurator:
    name: FerroConfigurator
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/ferro-configurator
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HOST_RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ferro-configurator

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check host workspace
        run: cargo check --workspace --locked

      - name: Test host workspace
        run: python ../../tools/run_tests.py configurator

      - name: Lint host workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  reqtool:
    name: Requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HOST_RUST_TOOLCHAIN }}

      - name: Install reqtool at its pinned revision and check every requirement file and the FAQ
        run: python tools/run_tests.py reqtool

  configurator-gui:
    name: FerroConfigurator GUI
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/ferro-configurator/gui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HOST_RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ferro-configurator/gui/src-tauri

      - name: Install page dependencies
        working-directory: tools/ferro-configurator/gui
        run: npm ci

      - name: Check the GUI
        run: python tools/run_tests.py gui

  rtic-app-builder:
    name: RTIC app builder
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Its rust-toolchain.toml pins its own nightly; rustup installs it on
      # first use.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/rtic-app-builder

      - name: Test the generator workspace
        run: python tools/run_tests.py rtic-app-builder

  windows-release-package:
    name: Ready Windows package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, host-tests, publication-security, configurator, documentation]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Foxeer firmware
        uses: actions/download-artifact@v4
        with:
          name: ferrowasp-foxeer-f405-v2-${{ github.sha }}-${{ env.FIRMWARE_TARGET }}
          path: staging/foxeer-f405-v2

      - name: Install host Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.HOST_RUST_TOOLCHAIN }}

      - name: Build FerroConfigurator
        working-directory: tools/ferro-configurator
        run: cargo build --release --locked -p ferro-configurator-cli

      - name: Validate release metadata
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python tools/release/check_release.py --tag "${{ github.ref_name }}"
          } else {
            python tools/release/check_release.py
          }

      - name: Assemble manifest-verified ready package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "0.1.0-${{ github.run_number }}"
          }
          ./tools/ferro-configurator/packaging/build-release.ps1 `
            -Version $version `
            -GitCommit "${{ github.sha }}" `
            -FirmwareElf "$env:GITHUB_WORKSPACE/staging/foxeer-f405-v2/FerroWaspFoxeerF405V2"

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: ferrowasp-ready-windows-x86_64
          path: tools/ferro-configurator/dist/*.zip*
          if-no-files-found: error

      - name: Publish tagged GitHub pre-release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FerroWasp ${{ github.ref_name }} — Experimental Foxeer F405 V2 Prototype
          body_path: .github/releases/${{ github.ref_name }}.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            tools/ferro-configurator/dist/*.zip
            tools/ferro-configurator/dist/*.zip.sha256

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2,mdbook-mermaid@0.17.0

      - name: Build book
        run: mdbook build mdbook

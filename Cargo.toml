[workspace]
resolver = "2"
members = [
    "crates/ferrowasp-config",
    "crates/ferrowasp-control",
    "firmware/foxeer-f405-v2/board",
    "firmware/tbs-lucid-h7/board",
    "firmware/speedybee-f405-v5/board",
    "crates/ferrowasp-blackbox",
    "crates/ferrowasp-blheli-telemetry",
    "crates/ferrowasp-border",
    "crates/ferrowasp-boundary-contracts",
    "crates/ferrowasp-cli",
    "crates/ferrowasp-crsf",
    "crates/ferrowasp-feedback",
    "crates/ferrowasp-flight-control",
    "crates/ferrowasp-icm42688p",
    "crates/ferrowasp-imu",
    "crates/ferrowasp-input",
    "crates/ferrowasp-io-contracts",
    "crates/ferrowasp-mpu6000",
    "crates/ferrowasp-mpu6500",
    "crates/ferrowasp-mspv1",
    "crates/ferrowasp-mspv2",
    "crates/ferrowasp-osd",
    "crates/ferrowasp-output",
    "crates/ferrowasp-protocol",
    "crates/ferrowasp-safety",
    "crates/ferrowasp-sensor-traits",
    "crates/ferrowasp-sensors",
    "crates/ferrowasp-serial",
    "crates/ferrowasp-stm32",
    "crates/ferrowasp-stm32-critical",
    "crates/ferrowasp-stm32-app",
    "crates/ferrowasp-storage",
    "crates/rc-pwm",
    "drivers/buzzer",
    "drivers/crsf-proto",
    "drivers/qmc5883l",
    "drivers/spl06",
    "drivers/ubx",
]
exclude = [
    "firmware/foxeer-f405-v2",
    "firmware/tbs-lucid-h7",
    "tools/ferro-configurator",
]

[workspace.dependencies]
critical-section = "=1.2.0"
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
embedded-io = "=0.7.1"
embedded-io-async = "=0.7.0"
heapless = "=0.9.2"


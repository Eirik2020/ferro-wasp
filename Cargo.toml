[workspace]
resolver = "2"
members = [
    "crates/ferrowasp-actuator",
    "crates/ferrowasp-core",
    "crates/ferrowasp-drivers",
    "crates/ferrowasp-io-core",
    "crates/ferrowasp-mspv1",
    "crates/ferrowasp-mspv2",
    "crates/ferrowasp-pid",
    "crates/ferrowasp-stm32f4",
    "crates/ferrowasp-tasks",
    "crates/ferrowasp-waveform",
    "crates/rc-pwm",
]
exclude = [
    "firmware/foxeer-f405-v2",
    "firmware/stm32f401-bringup",
    "firmware/stm32f405-flight",
    "tools/ferro-configurator",
]

[workspace.dependencies]
critical-section = "=1.2.0"
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
embedded-io = "=0.7.1"
embedded-io-async = "=0.7.0"
heapless = "=0.9.2"

# FerroForge is developed beside ferro-wasp in one repository while ferro-wasp
# adopts it. The dependency stays the published requirement; this points it at
# the checkout, and goes away once the release is on crates.io.
[patch.crates-io]
ferroforge = { path = "../ferroforge" }
